      ["Cross-links",`<div class="crosslinks"><button data-detail="enchondroma">Enchondroma</button><button data-detail="osteosarcoma">Osteosarcoma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},

desmoid:{
  badges:["Intermediate","Soft Tissue","Fibroblastic"],
  tabs:{
    "Overview":[
      ["At a Glance","Desmoid-type fibromatosis is a benign, nonmetastasizing but locally aggressive fibroblastic tumor. It can infiltrate or engulf adjacent nerves and vessels and has a meaningful risk of local recurrence."],
      ["Typical Location","Extra-abdominal desmoid tumors commonly arise in proximal extremity and trunk regions, including around the shoulder, buttock, posterior thigh, popliteal fossa, arm, and forearm."],
      ["Clinical Pearl","Desmoid tumors do not metastasize, but their locally infiltrative behavior can still produce major morbidity.","pearl"],
      ["Red Flag","A firm enlarging mass that restricts motion or causes neurovascular dysfunction deserves prompt imaging and biopsy-oriented evaluation.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Desmoid tumors are often firm and painful. They grow along muscle and fascial planes and may become large enough to restrict motion around the shoulder, hip, or knee."],
      ["Age / Context","They are most common in older children and young adults. Most are solitary, but multicentric disease can occur in association with familial adenomatous polyposis/Gardner syndrome."],
      ["What to Ask","Document growth rate, pain, prior surgery or recurrence, limitation of motion, neurologic symptoms, and relevant family history."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Origin</b><span>Muscle / fascial planes</span></div><div class="sig"><b>T1</b><span>Low signal</span></div><div class="sig"><b>T2</b><span>Intermediate-to-high signal</span></div><div class="sig"><b>Margin</b><span>Poorly encapsulated / infiltrative</span></div><div class="sig"><b>Extent</b><span>Tracks along tissue planes</span></div><div class="sig"><b>Best Test</b><span>MRI for local extent</span></div></div>`],
      ["MRI","MRI is the preferred study for noncalcified desmoid tumors and best demonstrates tumor extent along fascia and muscle planes."],
      ["Imaging Pearl","Unlike a well-encapsulated benign mass, desmoid fibromatosis may cross or track along anatomic planes despite its nonmetastatic biology.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/desmoid-tumour" target="_blank" rel="noopener noreferrer">Radiopaedia: Desmoid tumor ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","Desmoid tumors are heavily collagenized with a low mitotic index. Longitudinally oriented fibroblasts and myofibroblasts are embedded in a collagenous background."],
      ["Biologic Behavior","Histology can appear deceptively bland even though the tumor is locally aggressive and difficult to resect completely because it is poorly encapsulated."],
      ["Diagnostic Pearl","Core biopsy is generally required before definitive treatment because desmoid can mimic low-grade fibrosarcoma clinically and histologically."]
    ],
    "Treatment":[
      ["Observation","For asymptomatic or incidentally detected disease, observation is reasonable because some tumors stabilize over time."],
      ["Local Treatment","Surgery is used more selectively than in the past because recurrence after resection is common. Local options may also include cryoablation or focused ultrasound in selected cases."],
      ["Systemic / Multidisciplinary Options","Systemic therapy and radiation may be considered for progressive, recurrent, unresectable, or high-morbidity disease in a multidisciplinary setting."],
      ["NP / Clinic Workflow","Track tumor size, pain, functional limitation, neurovascular symptoms, and interval MRI. Escalate documented progression or worsening morbidity for multidisciplinary review."]
    ],
    "Prognosis":[
      ["Recurrence","OKU reports recurrence after resection in the range of about 25%–50% without additional treatment."],
      ["Natural History","Some tumors remain stable, and spontaneous involution is uncommon but reported."],
      ["Key Point","Local behavior—not metastatic spread—drives surveillance and treatment decisions."]
    ],
    "Exam":[
      ["How to Assess","Palpate the mass for firmness and fixation, measure or document size, assess nearby joint range of motion, and evaluate functional limitation."],
      ["Neurovascular Exam","Perform focused motor, sensory, pulse, and perfusion assessment when the lesion is near major nerves or vessels."],
      ["Red Flags","Progressive weakness, numbness, vascular compromise, or rapid loss of motion should prompt expedited reassessment."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 25: Benign Fibrous Tumors — Desmoid Tumors/Fibromatosis.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Desmoid tumor reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="sts">Soft-Tissue Sarcoma</button><button data-detail="dfsp">DFSP / Fibrosarcomatous DFSP</button></div>`]
    ]
  }
},

tgct:{
  badges:["Intermediate","Soft Tissue","Synovial"],
  tabs:{
    "Overview":[
      ["At a Glance","Tenosynovial giant cell tumor (TGCT) is a neoplastic proliferative disorder of synovium that includes the older entities pigmented villonodular synovitis (PVNS) and giant cell tumor of tendon sheath. It occurs in localized/nodular and diffuse forms."],
      ["Typical Location","The knee is the most common large-joint site, followed by the hip. Localized tendon-sheath disease commonly affects the hand."],
      ["Clinical Pearl","Hemosiderin is the key imaging clue: low signal on MRI with blooming on gradient-echo sequences is classic.","pearl"],
      ["Red Flag","Diffuse TGCT can erode bone and destroy the joint, and recurrence is common after treatment.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","TGCT often has an insidious course with intermittent joint swelling and discomfort that slowly progresses."],
      ["Localized Form","Nodular disease may present with mechanical symptoms such as popping, catching, or locking."],
      ["Diffuse Form","Advanced diffuse disease can cause pain, stiffness, bone erosion, joint destruction, and occasionally a palpable soft-tissue mass."],
      ["Hemarthrosis","Joint aspiration may reveal a hemarthrosis, although its absence does not exclude TGCT."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Origin</b><span>Synovial-based mass</span></div><div class="sig"><b>T1</b><span>Low / intermediate signal</span></div><div class="sig"><b>T2</b><span>Low / intermediate signal</span></div><div class="sig"><b>Hemosiderin</b><span>Blooming on gradient echo</span></div><div class="sig"><b>Radiograph</b><span>May be normal early</span></div><div class="sig"><b>Late Disease</b><span>Erosions / arthritis / bone invasion</span></div></div>`],
      ["MRI","MRI is often diagnostic, demonstrating villous or nodular synovial proliferation, joint effusion, low signal from hemosiderin, and blooming artifact on gradient-echo sequences."],
      ["Plain Radiographs","Radiographs may be normal other than an effusion early in the course. Advanced disease can show periarticular erosions, severe arthritis, or bone invasion."],
      ["Imaging Pearl","Low signal on both T1 and T2 due to hemosiderin is a high-yield clue for TGCT.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/tenosynovial-giant-cell-tumour" target="_blank" rel="noopener noreferrer">Radiopaedia: Tenosynovial giant cell tumor ↗</a></div>`]
    ],
    "Pathology":[
      ["Gross Pathology","Diffuse intra-articular TGCT produces villous proliferative synovium with a deep brown appearance from hemosiderin."],
      ["Histology","Pigment-laden macrophages, multinucleated giant cells, and hemosiderin are characteristic."],
      ["Molecular Biology","A recurrent CSF1-related translocation drives overexpression of colony-stimulating factor 1, which recruits large numbers of reactive macrophages."]
    ],
    "Treatment":[
      ["Localized Disease","Localized/nodular TGCT is treated with complete excision of the nodule, either open or arthroscopic depending on location."],
      ["Diffuse Disease","Diffuse disease usually requires synovectomy. Open synovectomy remains a benchmark approach when complete arthroscopic removal is unlikely."],
      ["Advanced Joint Damage","Bone erosion may require curettage with graft or cement; advanced degenerative disease may require arthroplasty."],
      ["Medical Therapy","For unresectable, multiply recurrent, or very morbid disease, CSF1-receptor–targeted therapy such as pexidartinib may be considered, with attention to hepatotoxicity."],
      ["NP / Clinic Workflow","Track pain, swelling, motion, recurrent effusions, mechanical symptoms, MRI burden, and postoperative recurrence. For systemic therapy, coordinate laboratory monitoring and adverse-effect surveillance."]
    ],
    "Prognosis":[
      ["Recurrence","Recurrence after surgical treatment is a major issue. OKU cites an average surgical recurrence rate around 20%–30%, with diffuse disease carrying the greater risk."],
      ["Localized vs Diffuse","Localized disease can often be cured with excision; diffuse disease has a much higher recurrence burden and may require multimodality treatment."],
      ["Malignancy","Malignant TGCT is exceedingly rare."]
    ],
    "Exam":[
      ["How to Assess","Inspect for joint swelling, palpate for effusion or a focal nodular mass, and document active and passive range of motion."],
      ["Mechanical Testing","Ask the patient to reproduce catching or locking and correlate symptoms with motion; assess gait for lower-extremity disease."],
      ["Neurovascular Exam","Document distal motor, sensory, pulses, and perfusion when disease is extensive or extra-articular."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 26: Synovial Chondromatosis and Tenosynovial Giant Cell Tumor/PVNS.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Tenosynovial giant cell tumor reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="synovial-chondromatosis">Synovial Chondromatosis</button><button data-detail="sts">Soft-Tissue Sarcoma</button></div>`]
    ]
  }
},

"synovial-chondromatosis":{
  badges:["Benign","Soft Tissue","Synovial"],
  tabs:{
    "Overview":[
      ["At a Glance","Synovial chondromatosis is a rare metaplastic process of synovium in which the lining produces multiple hyaline-cartilage nodules that may detach and become intra-articular loose bodies."],
      ["Typical Location","It most often affects adults 30–50 years old. The knee is most common, followed by the hip, shoulder, elbow, and ankle."],
      ["Clinical Pearl","Multiple cartilaginous loose bodies within a single joint are the defining pattern.","pearl"],
      ["Red Flag","Progressive joint destruction can occur if disease is untreated, and malignant transformation has been reported rarely.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Pain, swelling, loss of motion, popping, catching, and crepitus are common."],
      ["Why Diagnosis Can Be Delayed","Symptoms overlap with osteoarthritis, and early cartilaginous nodules may not yet be mineralized enough to be seen on radiographs."],
      ["Functional Impact","Mechanical symptoms and recurrent irritation can ultimately produce degenerative change and stiffness."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Location</b><span>Synovial-lined joint</span></div><div class="sig"><b>Radiograph</b><span>Multiple calcified loose bodies when mature</span></div><div class="sig"><b>MRI T1</b><span>Low-signal nodules</span></div><div class="sig"><b>MRI T2</b><span>High-signal nodules</span></div><div class="sig"><b>CT</b><span>Best for mineralization</span></div><div class="sig"><b>Late Disease</b><span>Erosion / degeneration</span></div></div>`],
      ["Plain Radiographs","Early disease may be occult if nodules have not mineralized. With maturation, multiple calcified nodules become visible, often with denser peripheral mineralization."],
      ["MRI","MRI can identify the cartilaginous nodules before calcification. Nodules are typically low on T1 and high on T2; calcification creates signal voids."],
      ["CT","CT is particularly useful for defining mineralization, erosions, and degenerative changes."],
      ["Imaging Pearl","A normal or minimally abnormal radiograph does not exclude early synovial chondromatosis if MRI shows multiple cartilaginous nodules.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/synovial-chondromatosis" target="_blank" rel="noopener noreferrer">Radiopaedia: Synovial chondromatosis ↗</a></div>`]
    ],
    "Pathology":[
      ["Gross Pathology","The classic gross appearance is multiple glistening white loose bodies, sometimes numbering into the hundreds. Some remain embedded in synovium."],
      ["Histology","Well-circumscribed nodules of hyaline cartilage containing clusters of chondrocytes are characteristic."],
      ["Biology","OKU categorizes synovial chondromatosis as a metaplastic rather than clearly neoplastic process, although debate remains."]
    ],
    "Treatment":[
      ["Surgery","Treatment is removal of loose bodies plus synovectomy of the involved joint."],
      ["Open vs Arthroscopic","Both open and arthroscopic approaches are used. Arthroscopy is less invasive, but a limited synovectomy or inability to remove large bodies may increase recurrence risk."],
      ["Advanced Degeneration","If the joint has advanced degenerative change, arthroplasty may be considered at the same time as synovectomy."],
      ["NP / Clinic Workflow","Track mechanical symptoms, effusions, motion loss, and recurrence. After surgery, monitor wound healing, return of function, and repeat imaging if symptoms recur."]
    ],
    "Prognosis":[
      ["Prognosis","The overall course is usually benign, but untreated disease can cause progressive joint destruction."],
      ["Recurrence","Local recurrence occurs, although OKU notes that precise recurrence rates are not well defined."],
      ["Malignant Transformation","Malignant progression is rare but has been reported."]
    ],
    "Exam":[
      ["How to Assess","Inspect for swelling or effusion, palpate the joint, and assess active and passive range of motion."],
      ["Mechanical Symptoms","Evaluate for crepitus, catching, or locking through a functional arc of motion."],
      ["Function","Assess gait or upper-extremity use depending on the joint involved and document pain with loading or activity."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 26: Synovial Chondromatosis and Tenosynovial Giant Cell Tumor/PVNS.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Synovial chondromatosis reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="tgct">Tenosynovial Giant Cell Tumor</button><button data-route="imaging">Soft-Tissue Masses</button></div>`]
    ]
  }
},

alt:{
  badges:["Intermediate","Soft Tissue","Adipocytic"],
  tabs:{
    "Overview":[
      ["At a Glance","Atypical lipomatous tumor (ALT) is a locally aggressive adipocytic neoplasm of the extremities and limb girdles. The closely related term well-differentiated liposarcoma (WDL) is generally used for analogous tumors in the abdomen or retroperitoneum, where complete resection is more difficult and behavior is less favorable."],
      ["Natural History","ALT does not typically metastasize unless it undergoes dedifferentiation, but it has a higher local recurrence risk than ordinary lipoma."],
      ["Clinical Pearl","A large, deep, predominantly fatty mass in a middle-aged or older adult should raise suspicion for ALT rather than assuming it is a simple lipoma.","pearl"],
      ["Red Flag","New nodular nonfatty tissue, increasing enhancement, or rapid change within a known ALT raises concern for dedifferentiation and requires prompt reassessment.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","ALT usually presents later in adult life and commonly arises in deep muscle compartments. It may resemble a deep lipoma clinically and can reach substantial size before detection."],
      ["Symptoms","Many are painless masses or areas of fullness. Symptoms may occur from size, mass effect, or compression of adjacent structures."],
      ["Key History","Document duration, interval growth, prior excision or recurrence, pain, neurologic symptoms, and whether the mass is deep or recurrent."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Composition</b><span>Predominantly fat</span></div><div class="sig"><b>Depth</b><span>Often deep to fascia</span></div><div class="sig"><b>Septa</b><span>May be thick / fibrovascular</span></div><div class="sig"><b>Nodules</b><span>Nonfatty nodular areas increase concern</span></div><div class="sig"><b>MRI</b><span>Can overlap substantially with lipoma</span></div><div class="sig"><b>Dediff.</b><span>Nonlipomatous signal / enhancement</span></div></div>`],
      ["MRI","ALT is predominantly fatty and may appear relatively bland on MRI. More fibrovascular stranding, thick septa, or nodular enhancing areas can increase suspicion, but imaging alone does not reliably distinguish every ALT from lipoma."],
      ["Risk Features","OKU highlights features associated with ALT rather than lipoma including very large size, thick septa, nodular enhancement, a lower proportion of fat, older age, and deep lower-extremity location."],
      ["Imaging Pearl","When a fatty mass is large and deep, avoid relying on the word “lipoma” from appearance alone; clinical context, pathology, and MDM2 testing may be needed.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/atypical-lipomatous-tumour" target="_blank" rel="noopener noreferrer">Radiopaedia: Atypical lipomatous tumor ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","ALT and lipoma both contain mature adipose tissue, but ALT contains fibrous septa with atypical spindle cells."],
      ["Molecular Testing","Amplification involving MDM2 is a key diagnostic feature of ALT/WDL and is useful when morphology or imaging is equivocal. Cytogenetic abnormalities may also involve HMGA2."],
      ["Diagnostic Pearl","For problematic deep or recurrent fatty tumors, MDM2 testing can be decisive in separating ALT from conventional lipoma."]
    ],
    "Treatment":[
      ["Surgery","Marginal surgical excision is an appropriate treatment for extremity ALT in many cases."],
      ["Radiation","Routine postoperative radiation is not usually required for resectable ALT. OKU notes that radiation is more often reserved for recurrent, residual, or unresectable disease near critical structures."],
      ["NP / Clinic Workflow","Review final pathology and MDM2 status when relevant, assess wound and function after resection, document baseline postoperative imaging, and monitor the tumor bed for local recurrence."]
    ],
    "Prognosis":[
      ["Local Recurrence","ALT has a higher local recurrence rate than lipoma. Recurrence risk is influenced by prior recurrence, anatomy, and completeness of surgery."],
      ["Dedifferentiation","Dedifferentiation is uncommon but clinically important because it converts the lesion into a high-grade sarcoma capable of metastasis."],
      ["Surveillance","OKU recommends postoperative baseline and periodic local imaging, commonly MRI, to detect local recurrence or dedifferentiation. Follow-up intensity may decrease after a stable early surveillance period."]
    ],
    "Exam":[
      ["How to Assess","Document mass size, depth, mobility, firmness, skin changes, tenderness, and relationship to adjacent joints or compartments."],
      ["Neurovascular Exam","Check motor and sensory function when the mass is near major nerves and assess distal perfusion if it lies near major vessels."],
      ["Red Flags on Exam","Rapid enlargement, increasing firmness, new pain, fixation, or new neurologic deficits should trigger reassessment."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 23: Lipoma and Other Benign Lipomatous Tumors — Atypical Lipomatous Tumor.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Atypical lipomatous tumor reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="lipoma">Lipoma</button><button data-detail="liposarcoma">Liposarcoma</button></div>`]
    ]
  }
},

schwannoma:{
  badges:["Benign","Soft Tissue","Peripheral nerve sheath"],
  tabs:{
    "Overview":[
      ["At a Glance","Schwannoma, also called neurilemoma, is a benign peripheral nerve sheath tumor composed of Schwann cells. Most are isolated, noninfiltrating masses with eccentric growth from the parent nerve."],
      ["Epidemiology & Location","Schwannomas can occur at any age but are most common in adults 20–40 years old. Common sites include the head and neck, flexor surfaces of the extremities, spinal nerve roots, mediastinum, and retroperitoneum."],
      ["Clinical Pearl","An eccentric, well-encapsulated mass arising from a nerve favors schwannoma over neurofibroma.","pearl"],
      ["Red Flag","New rapid growth, marked neurologic change, or atypical destructive features warrant reassessment even though malignant transformation of a conventional solitary schwannoma is very rare.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Many schwannomas are discovered as painless masses. Neurologic symptoms occur when the lesion compresses the parent nerve or adjacent nerve fibers."],
      ["Tinel Sign","Percussion over the tumor may reproduce paresthesia in the distribution of the involved nerve."],
      ["Syndromic Context","Multiple schwannomas should prompt consideration of an inherited tumor syndrome rather than assuming several unrelated sporadic lesions."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Shape</b><span>Fusiform / ovoid / dumbbell</span></div><div class="sig"><b>T1</b><span>Low-to-intermediate signal</span></div><div class="sig"><b>T2</b><span>High signal</span></div><div class="sig"><b>Position</b><span>Eccentric to parent nerve</span></div><div class="sig"><b>Signs</b><span>Target or split-fat sign may occur</span></div><div class="sig"><b>Degeneration</b><span>Cystic change more common than in neurofibroma</span></div></div>`],
      ["MRI","MRI is the most useful study for defining the lesion and its relationship to the parent nerve. Schwannomas may be fusiform, ovoid, or dumbbell shaped with low-to-intermediate T1 and high T2 signal."],
      ["Schwannoma vs Neurofibroma","If the nerve of origin is visible, eccentric position relative to the nerve favors schwannoma; central incorporation of the nerve favors neurofibroma."],
      ["Ancient Change","Long-standing schwannomas may undergo cystic degeneration, hyalinization, or calcification, producing a more heterogeneous appearance."],
      ["Imaging Pearl","The relationship to the parent nerve is often more diagnostically useful than nonspecific MRI signs such as the target sign.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/schwannoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Schwannoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Gross Pathology","Conventional schwannoma is typically tan-white, firm, well encapsulated, and eccentrically attached to the parent nerve."],
      ["Histology","Classic schwannoma alternates between compact Antoni A areas and looser Antoni B areas. Palisaded nuclei forming Verocay bodies are characteristic."],
      ["Immunohistochemistry","Typical schwannomas show strong S100 positivity."],
      ["Variant Pearl","Cellular schwannoma can have high cellularity and mitotic activity yet remain benign; histologic context prevents overcalling malignancy."]
    ],
    "Treatment":[
      ["Observation","Small asymptomatic lesions may be observed when the diagnosis is secure and function is preserved."],
      ["Surgery","Symptomatic or enlarging schwannomas are commonly excised. Because the tumor is encapsulated and eccentric, it can often be enucleated while preserving the parent nerve."],
      ["Nerve Preservation","For lesions arising from major nerves, careful fascicular dissection and intraoperative nerve stimulation may help minimize neurologic injury."],
      ["NP / Clinic Workflow","Document preoperative motor and sensory function, Tinel sign and pain distribution, then compare neurologic status after surgery and monitor for recurrent symptoms."]
    ],
    "Prognosis":[
      ["Prognosis","The prognosis of a solitary schwannoma is excellent after complete excision, especially when it arises from a minor nerve branch."],
      ["Recurrence","Recurrence depends primarily on location and completeness of excision; progression after subtotal removal can occur but is often slow."],
      ["Malignant Transformation","Malignant transformation of a conventional solitary schwannoma is very rare."]
    ],
    "Exam":[
      ["How to Test","Palpate the mass and gently percuss over it to assess for a Tinel response. Map any reproduced paresthesia to a specific peripheral nerve distribution."],
      ["Motor Exam","Test motor groups supplied by the suspected nerve and compare side-to-side strength."],
      ["Sensory Exam","Assess light touch in the involved nerve distribution and document numbness, dysesthesia, or neuropathic pain."],
      ["Mass Mobility","A nerve sheath tumor may move more readily side-to-side than longitudinally along the nerve."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 24: Benign Neural Tumors — Schwannoma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Schwannoma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="neurofibroma">Neurofibroma</button><button data-detail="mpnst">Malignant Peripheral Nerve Sheath Tumor</button></div>`]
    ]
  }

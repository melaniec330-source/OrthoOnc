<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082f52">
<title>OrthoPearls</title>
<style>
:root{
  --navy:#082f52;--navy2:#0c466f;--bg:#f4f7fa;--card:#fff;--ink:#14283a;
  --muted:#6e7e8c;--line:#dce5ec;--soft:#edf3f7;--danger:#b42318;--dangerbg:#fff2f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}
main{padding-bottom:76px}
.hidden{display:none!important}
.hero{
  color:#fff;padding:calc(34px + env(safe-area-inset-top)) 20px 24px;
  min-height:290px;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#041f37,#073d67 68%,#0d4f80)
}
.hero:after{
  content:"";position:absolute;right:-35px;top:20px;width:230px;height:270px;opacity:.13;
  background:
    radial-gradient(ellipse at 45% 20%,transparent 0 17%,#e3f0fa 18% 20%,transparent 21% 32%,#e3f0fa 33% 35%,transparent 36%),
    linear-gradient(90deg,transparent 47%,#e3f0fa 48% 52%,transparent 53%);
  transform:rotate(-10deg)
}
.hero-content{position:relative;z-index:1}
.hero h1{margin:0;font:500 3rem/1 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
.hero .sub{margin:.45rem 0 0;font-size:1rem}
.hero .tag{margin:.25rem 0 0;color:#dbe9f3;font-size:.84rem}
.search-launch{
  position:relative;z-index:1;margin-top:38px;width:100%;border:1px solid rgba(255,255,255,.36);
  background:rgba(255,255,255,.13);color:white;border-radius:14px;padding:12px 14px;text-align:left
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.tile{
  min-height:132px;border:1px solid var(--line);background:var(--card);border-radius:15px;
  color:var(--ink);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center
}
.tile .glyph{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--navy2);font-weight:800;margin-bottom:8px}
.tile b{font-size:.95rem}.tile small{display:block;color:var(--muted);font-size:.7rem;margin-top:5px;line-height:1.3}
.footer-note{text-align:center;color:var(--muted);font:italic .84rem Georgia,serif;margin:4px 0 24px}
.topbar{
  position:sticky;top:0;z-index:20;height:calc(58px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);background:var(--navy);color:white;
  display:grid;grid-template-columns:48px 1fr 48px;align-items:center
}
.topbar button{border:0;background:none;color:white;font-size:1.7rem}
.topbar h2{margin:0;text-align:center;font:700 1.08rem Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{padding:18px 14px 28px}
.eyebrow{margin:0 0 5px;text-transform:uppercase;letter-spacing:.11em;color:var(--navy2);font-weight:800;font-size:.66rem}
.page h1{margin:0;font:700 1.76rem Georgia,serif}
.lead{color:var(--muted);font-size:.87rem;line-height:1.5;margin:7px 0 16px}
.list{display:grid;gap:9px}
.row{
  width:100%;display:grid;grid-template-columns:46px 1fr 18px;gap:10px;align-items:center;
  border:1px solid var(--line);background:var(--card);border-radius:14px;color:var(--ink);padding:10px;text-align:left
}
.thumb{width:46px;height:46px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--navy2);font-weight:800}
.row b{display:block}.row small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}.chev{font-size:1.45rem;color:var(--navy2)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:12px -14px 14px;padding:0 14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);padding:9px;border-bottom:2px solid transparent;white-space:nowrap;font-size:.76rem}
.tab.active{color:var(--navy2);border-bottom-color:var(--navy2);font-weight:800}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:1rem}.card p,.card li{color:var(--muted);font-size:.86rem;line-height:1.5}.card ul{padding-left:20px;margin:0}
.pearl{padding-left:52px;position:relative;background:linear-gradient(135deg,var(--card),#f3f7f9)}
.pearl:before{
  content:"";position:absolute;left:15px;top:15px;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 20%,#f7f0e6 42%,#d5c4b3 78%,#9c8f82 100%);
  box-shadow:0 2px 5px #0002
}
.red{background:var(--dangerbg);border-color:#f0c9c4}.red h3{color:var(--danger)}
.searchbox{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;margin:12px 0}
.searchbox input{width:100%;border:0;outline:0;background:none;color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);background:var(--card);border-radius:14px}
.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:30;width:min(760px,100%);
  height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line)
}
.bottom button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bottom button.active{color:var(--navy2);font-weight:800}.bottom small{font-size:.62rem}
@media(max-width:390px){.hero h1{font-size:2.65rem}.grid{padding:11px}.tile{min-height:122px}}
</style>
</head>
<body>
<div id="app">
<header id="topbar" class="topbar hidden">
  <button id="backBtn" aria-label="Back">‹</button>
  <h2 id="topTitle">OrthoPearls</h2>
  <button id="favBtn" class="hidden" aria-label="Favorite">☆</button>
</header>
<main id="view"></main>
<nav class="bottom">
  <button data-route="home"><span>⌂</span><small>Home</small></button>
  <button data-route="search"><span>⌕</span><small>Search</small></button>
  <button data-route="favorites"><span>☆</span><small>Favorites</small></button>
  <button data-route="settings"><span>⚙︎</span><small>Settings</small></button>
</nav>
</div>

<script>
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const view=$("#view"), topbar=$("#topbar"), topTitle=$("#topTitle"), favBtn=$("#favBtn");
const FKEY="orthopearl_clean_favorites";

const sections=[
  ["tumors","Tumor Library","Dx","Benign · Malignant · Tumor-like"],
  ["anatomy","Orthopaedic Anatomy","◒","Regional · Neurovascular"],
  ["exam","Physical Exam","♧","How to test · Documentation"],
  ["imaging","Imaging Principles","XR","Systematic interpretation"],
  ["metastatic","Metastatic Bone Disease","✣","Risk · Workup · Management"],
  ["quiz","Quiz & Learning","?","Practice from app content"]
];

const entries=[
  {id:"osteochondroma",title:"Osteochondroma",group:"tumors",sub:"Benign cartilage-capped bone lesion"},
  {id:"osteosarcoma",title:"Osteosarcoma",group:"tumors",sub:"Malignant osteoid-producing bone tumor"},
  {id:"enchondroma",title:"Enchondroma",group:"tumors",sub:"Benign medullary cartilage lesion"},
  {id:"knee",title:"Knee",group:"anatomy",sub:"Joint · popliteal anatomy · common fibular nerve"},
  {id:"nerves",title:"Peripheral Nerve Innervation",group:"anatomy",sub:"Motor · sensory · how to test"},
  {id:"general-exam",title:"General Tumor Exam",group:"exam",sub:"Mass · skin · ROM · neurovascular"},
  {id:"bone-lesion",title:"How to Read a Bone Lesion",group:"imaging",sub:"Age · location · margin · matrix · periosteum"},
  {id:"mirels",title:"Mirels Score",group:"metastatic",sub:"Impending fracture risk screening"}
];

const content={
osteochondroma:{
  tabs:{
    "Overview":[
      ["Overview","Benign bone lesion arising near the physis with cortex and medullary canal continuous with the parent bone."],
      ["Clinical Pearl","Cortical and medullary continuity is the key imaging feature. New pain or growth after skeletal maturity deserves reassessment.","pearl"]
    ],
    "Imaging":[["Imaging","Sessile or pedunculated exostosis with cortical and medullary continuity. Cross-sectional imaging can assess cartilage cap and adjacent neurovascular structures."]],
    "Treatment":[["Treatment","Asymptomatic solitary lesions are commonly observed. Symptomatic or concerning lesions may be excised with complete cartilage-cap removal."]],
    "Exam":[["How to Test","Inspect and palpate the mass, assess adjacent-joint ROM, document distal motor/sensory function and pulses, and note any mechanical impingement."]]
  }
},
osteosarcoma:{
  tabs:{
    "Overview":[["Overview","High-grade malignant osteoid-producing bone tumor, classically metaphyseal and commonly around the knee in adolescents and young adults."]],
    "Imaging":[["Imaging","Look for aggressive bone destruction, osteoid matrix, cortical violation, aggressive periosteal reaction, and soft-tissue extension."]],
    "Staging":[["Staging & Workup","Local MRI, chest staging, and oncologically planned biopsy are key before definitive treatment."]],
    "Treatment":[["Treatment","Treatment typically combines systemic chemotherapy with wide surgical resection when feasible."]]
  }
},
enchondroma:{
  tabs:{
    "Overview":[["Overview","Benign intramedullary hyaline-cartilage lesion, often incidental."]],
    "Imaging":[["Imaging","Usually well marginated with chondroid mineralization. Evaluate pain, endosteal scalloping, cortical change, size, and interval change."]],
    "Treatment":[["Treatment","Observation is common when asymptomatic and characteristic; concerning features warrant further workup."]]
  }
},
knee:{
  tabs:{
    "Overview":[["Key Anatomy","Distal femur, proximal tibia/fibula, patella, cruciate/collateral ligaments, menisci, and extensor mechanism."]],
    "Relationships":[["Tumor / Surgical Relationships","Popliteal vessels and tibial nerve lie posteriorly; the common fibular nerve courses around the fibular neck."]],
    "How to Test":[["How to Test","Assess knee ROM, straight-leg raise/extensor mechanism, ankle dorsiflexion/EHL/plantar flexion, distal sensation, DP/PT pulses, and compare with the opposite side."]]
  }
},
nerves:{
  tabs:{
    "Overview":[["Framework","For each nerve: roots → course → motor → sensory → bedside test → expected deficit."]],
    "How to Test":[["Examples","Axillary: resisted abduction. Radial: wrist/finger extension. Median: thumb abduction/opposition. Ulnar: finger abduction. Common fibular: dorsiflexion/eversion. Tibial: plantar flexion."]]
  }
},
"general-exam":{
  tabs:{
    "Exam":[["General Tumor Exam","Document mass size, location, depth, consistency, mobility/fixation, tenderness, skin changes, scars/biopsy tracts, adjacent ROM, and distal neurovascular status."]],
    "How to Document":[["Clinical Pearl","Use the same motor and sensory sequence every time so postoperative change is easier to detect.","pearl"]]
  }
},
"bone-lesion":{
  tabs:{
    "Checklist":[["10-Step Checklist","1. Age<br>2. Bone + exact location<br>3. Epiphysis / metaphysis / diaphysis<br>4. Medullary / cortical / surface<br>5. Margin + zone of transition<br>6. Matrix<br>7. Periosteal reaction<br>8. Cortical behavior<br>9. Soft-tissue component<br>10. Solitary vs multiple"]],
    "Interpretation":[["Interpretation","No single feature determines biologic behavior. Combine age, location, margins, matrix, periosteal response, cortex, and soft-tissue findings."]]
  }
},
mirels:{
  tabs:{
    "Overview":[["Mirels Score","Classic screening score uses site, pain, lesion type, and size. A complete mechanical and oncologic assessment is still required."]]
  }
}
};

function favs(){try{return JSON.parse(localStorage.getItem(FKEY)||"[]")}catch{return[]}}
function isFav(id){return favs().includes(id)}
function toggleFav(id){let f=favs();f=isFav(id)?f.filter(x=>x!==id):[...f,id];localStorage.setItem(FKEY,JSON.stringify(f));favBtn.textContent=isFav(id)?"★":"☆"}
function go(r){location.hash=r}
function setTop(title,showFav=false,id=""){topbar.classList.remove("hidden");topTitle.textContent=title;favBtn.classList.toggle("hidden",!showFav);favBtn.dataset.id=id;if(showFav)favBtn.textContent=isFav(id)?"★":"☆"}
function hideTop(){topbar.classList.add("hidden")}
function activeNav(r){$$(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.route===r))}
function row(x){const icon=x.group==="imaging"?"XR":x.group==="tumors"?"Dx":"•";return `<button class="row" data-detail="${x.id}"><span class="thumb">${icon}</span><span><b>${x.title}</b><small>${x.sub}</small></span><span class="chev">›</span></button>`}

function home(){
  hideTop();activeNav("home");
  view.innerHTML=`<section class="hero"><div class="hero-content"><h1>OrthoPearls</h1><p class="sub">Orthopaedic Oncology</p><p class="tag">Learn. Apply. Excel.</p></div><button class="search-launch" data-route="search">⌕ &nbsp; Search tumors, anatomy, imaging…</button></section><section class="grid">${sections.map(s=>`<button class="tile" data-route="${s[0]}"><span class="glyph">${s[2]}</span><b>${s[1]}</b><small>${s[3]}</small></button>`).join("")}</section><p class="footer-note">Clinician education reference · No PHI</p>`
}
function sectionPage(id){
  const s=sections.find(x=>x[0]===id);setTop(s[1]);activeNav("");
  if(id==="quiz"){view.innerHTML=`<section class="page"><p class="eyebrow">Learning</p><h1>Quiz & Learning</h1><p class="lead">This section is intentionally minimal in the first clean build. We will add the quiz engine after you approve the shell and navigation.</p><div class="empty">Shell working correctly.</div></section>`;return}
  const list=entries.filter(x=>x.group===id);
  view.innerHTML=`<section class="page"><p class="eyebrow">Reference</p><h1>${s[1]}</h1><p class="lead">${s[3]}</p><div class="list">${list.length?list.map(row).join(""):`<div class="empty">Content will be added after shell approval.</div>`}</div></section>`
}
function detailPage(id,tab){
  const e=entries.find(x=>x.id===id), d=content[id]; if(!e||!d)return home();
  const tabs=Object.keys(d.tabs), current=tab&&tabs.includes(tab)?tab:tabs[0];
  setTop(e.title,true,id);activeNav("");
  const cards=d.tabs[current].map(c=>`<section class="card ${c[2]||""}"><h3>${c[0]}</h3><p>${c[1]}</p></section>`).join("");
  view.innerHTML=`<section class="page"><p class="eyebrow">${sections.find(x=>x[0]===e.group)[1]}</p><h1>${e.title}</h1><p class="lead">${e.sub}</p><div class="tabs">${tabs.map(t=>`<button class="tab ${t===current?"active":""}" data-tab="${t}" data-id="${id}">${t}</button>`).join("")}</div>${cards}</section>`
}
function searchPage(q=""){
  setTop("Search");activeNav("search");
  const term=q.toLowerCase(), r=entries.filter(e=>!term||(`${e.title} ${e.sub}`).toLowerCase().includes(term));
  view.innerHTML=`<section class="page"><p class="eyebrow">Universal search</p><h1>Search</h1><div class="searchbox"><input id="searchInput" value="${q}" placeholder="Search OrthoPearls…"></div><div id="results" class="list">${r.length?r.map(row).join(""):`<div class="empty">No matches.</div>`}</div></section>`
}
function favoritesPage(){
  setTop("Favorites");activeNav("favorites");
  const r=entries.filter(e=>isFav(e.id));
  view.innerHTML=`<section class="page"><p class="eyebrow">Saved reference</p><h1>Favorites</h1><p class="lead">Tap ☆ on a detail page to save it here.</p><div class="list">${r.length?r.map(row).join(""):`<div class="empty">No favorites yet.</div>`}</div></section>`
}
function settingsPage(){
  setTop("Settings");activeNav("settings");
  view.innerHTML=`<section class="page"><p class="eyebrow">App</p><h1>Settings</h1><section class="card"><h3>Clean build</h3><p>No service worker, no offline caching, and no external JS/CSS yet. This is intentional so we can verify the app shell and navigation first.</p></section></section>`
}
function render(){
  const h=location.hash.slice(1)||"home";
  if(h==="home")return home();
  if(h==="search")return searchPage();
  if(h==="favorites")return favoritesPage();
  if(h==="settings")return settingsPage();
  if(sections.some(s=>s[0]===h))return sectionPage(h);
  if(h.startsWith("detail/"))return detailPage(h.split("/")[1]);
  home()
}
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-route]");if(r){go(r.dataset.route);return}
  const d=e.target.closest("[data-detail]");if(d){go("detail/"+d.dataset.detail);return}
  const t=e.target.closest("[data-tab]");if(t){detailPage(t.dataset.id,t.dataset.tab);return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="searchInput"){
    const q=e.target.value.toLowerCase();
    const r=entries.filter(x=>!q||(`${x.title} ${x.sub}`).toLowerCase().includes(q));
    $("#results").innerHTML=r.length?r.map(row).join(""):`<div class="empty">No matches.</div>`;
  }
});
$("#backBtn").addEventListener("click",()=>history.length>1?history.back():go("home"));
favBtn.addEventListener("click",()=>{if(favBtn.dataset.id)toggleFav(favBtn.dataset.id)});
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>

neurofibroma:{
  badges:["Benign","Soft Tissue","Peripheral nerve sheath"],
  tabs:{
    "Overview":[
      ["At a Glance","Neurofibroma is a benign peripheral nerve sheath tumor that incorporates elements of the parent nerve rather than growing eccentrically from it. Most are solitary, but multiple or plexiform lesions can be associated with NF1."],
      ["Epidemiology","Neurofibromas may occur at any age but are most common in adults 20–30 years old. They can involve peripheral nerves, skin, soft tissue, and occasionally bone."],
      ["Clinical Pearl","A centrally located fusiform nerve sheath mass that blends into the parent nerve favors neurofibroma over schwannoma.","pearl"],
      ["Red Flag","A rapidly enlarging or increasingly painful plexiform or large neurofibroma should raise concern for malignant peripheral nerve sheath tumor and prompt biopsy-oriented evaluation.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Superficial neurofibromas are usually small painless masses. Deeper lesions more often cause neurologic symptoms, pain, tenderness, or a positive Tinel sign."],
      ["Patterns","Localized intraneural and cutaneous neurofibromas are common forms. Diffuse neurofibroma infiltrates subcutaneous tissue. Plexiform neurofibroma expands multiple nerve fascicles and can form a large “bag-of-worms” mass."],
      ["NF1","Plexiform neurofibroma is strongly associated with NF1. Patients with multiple neurofibromas or a plexiform lesion should be evaluated for NF1."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Shape</b><span>Fusiform along nerve</span></div><div class="sig"><b>Position</b><span>Central to parent nerve</span></div><div class="sig"><b>T1</b><span>Low signal</span></div><div class="sig"><b>T2</b><span>High signal</span></div><div class="sig"><b>Target Sign</b><span>More typical than in schwannoma</span></div><div class="sig"><b>Enhancement</b><span>Often avid</span></div></div>`],
      ["MRI","MRI is useful for defining both tumor extent and the entering/exiting parent nerve. Neurofibromas often have a fusiform shape aligned with the nerve and may taper into it at both ends."],
      ["Target Sign","A central low-signal region with peripheral high T2 signal can produce the target sign. This is not specific but is more typical of neurofibroma than schwannoma."],
      ["Neurofibroma vs Schwannoma","Central incorporation of the nerve favors neurofibroma; eccentric location favors schwannoma."],
      ["Bone Effects","A lesion adjacent to bone may cause pressure erosion, and rare neurofibromas can simulate intraosseous lesions."],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/neurofibroma" target="_blank" rel="noopener noreferrer">Radiopaedia: Neurofibroma ↗</a></div>`]
    ],
    "Pathology":[
      ["Gross Pathology","Neurofibroma is usually a firm gray-white rubbery mass intimately associated with the parent nerve. Unlike schwannoma, it is not encapsulated."],
      ["Histology","The tumor contains spindle cells including Schwann cells and fibroblasts with wavy nuclei embedded in myxoid stroma and wavy collagen bundles. Nerve fibers are commonly incorporated within the lesion."],
      ["Immunohistochemistry","S100 expression is variable rather than uniformly strong."],
      ["Genetics","NF1-associated and solitary neurofibromas involve loss of neurofibromin function through NF1 gene alterations."]
    ],
    "Treatment":[
      ["Observation","Asymptomatic lesions involving an important major nerve may be observed when surgery would create more morbidity than the tumor itself."],
      ["Surgery","Complete excision is preferred for symptomatic lesions in expendable nerves, but neurofibromas can be difficult to remove without sacrificing fascicles because the tumor is intertwined with the parent nerve."],
      ["Plexiform / Diffuse Disease","Diffuse and plexiform lesions require individualized management because complete resection may be highly morbid or impossible."],
      ["NP / Clinic Workflow","Document baseline pain, growth rate, motor and sensory deficits, NF1 history or features, and interval change. Escalate new rapid growth or pain for malignant transformation workup."]
    ],
    "Prognosis":[
      ["Solitary Lesions","Prognosis is generally excellent after complete excision of a solitary neurofibroma, although recurrence can occur."],
      ["Malignant Risk","Risk is concentrated in large and plexiform lesions, particularly in NF1. OKU cites an approximately 5% risk of malignant peripheral nerve sheath tumor in this setting."],
      ["Surveillance Pearl","Growth pattern and pain matter: a rapidly enlarging or newly painful lesion should not be assumed to represent ordinary neurofibroma behavior.","pearl"]
    ],
    "Exam":[
      ["How to Test","Palpate and gently percuss the mass for tenderness or Tinel response, then map symptoms to the involved nerve."],
      ["Motor Exam","Test muscle groups innervated by the parent nerve and compare strength bilaterally."],
      ["Sensory Exam","Assess light touch in the nerve distribution and document numbness, paresthesia, or allodynia."],
      ["NF1 Context","When multiple lesions or a plexiform pattern is present, perform a broader skin and neurologic assessment and coordinate appropriate evaluation for NF1."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 24: Benign Neural Tumors — Neurofibroma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Neurofibroma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="schwannoma">Schwannoma</button><button data-detail="mpnst">Malignant Peripheral Nerve Sheath Tumor</button></div>`]
    ]
  }
},

abc:{
  badges:["Benign","Bone","Cystic"],
  tabs:{
    "Overview":[
      ["At a Glance","Aneurysmal bone cyst (ABC) is a benign but locally aggressive cystic neoplasm of bone composed of blood-filled spaces. It most often affects children and young adults and may arise as a primary lesion or secondarily within another tumor."],
      ["Epidemiology & Location","Median age is about 13 years, and most patients are younger than 30. Common sites include the proximal humerus, distal femur, and proximal tibia; the pelvis, sacrum, and spine are also important locations."],
      ["Clinical Pearl","ABC is typically more expansile than a unicameral bone cyst and may extend wider than the adjacent physis.","pearl"],
      ["Red Flag","Fluid-fluid levels are characteristic but not diagnostic. Telangiectatic osteosarcoma and other aggressive lesions remain in the differential when imaging is atypical.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Patients usually report mild-to-moderate pain with swelling. Pathologic fracture can occur and may abruptly worsen symptoms."],
      ["Spine","Spinal ABCs may present with radicular symptoms, scoliosis, vertebral collapse, or neurologic deficits."],
      ["Secondary ABC","Approximately 30% arise within another lesion. Reported associated lesions include osteoblastoma, chondroblastoma, giant cell tumor, and fibrous dysplasia."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Age</b><span>Usually &lt;30 years</span></div><div class="sig"><b>Location</b><span>Eccentric metaphysis</span></div><div class="sig"><b>Expansion</b><span>Marked; may exceed physeal width</span></div><div class="sig"><b>Margin</b><span>Thin peripheral bony shell</span></div><div class="sig"><b>Internal</b><span>Multiloculated / septated</span></div><div class="sig"><b>MRI / CT</b><span>Fluid-fluid levels common</span></div></div>`],
      ["Plain Radiographs","ABC appears as an eccentric lucent metaphyseal lesion with an expansile contour and thin cortical rim. The lesion may extend wider than the metaphysis, unlike the usual appearance of UBC."],
      ["MRI / CT","Cross-sectional imaging often shows multiple fluid- or blood-filled chambers separated by septa. Fluid-fluid levels are characteristic but not specific."],
      ["Imaging Pearl","Marked expansion plus multiloculation and fluid-fluid levels strongly suggests ABC, but diagnosis must still fit the entire clinical and imaging picture.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/aneurysmal-bone-cyst" target="_blank" rel="noopener noreferrer">Radiopaedia: Aneurysmal bone cyst ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","ABC contains large blood-filled spaces separated by fibrous septa. The lining is fibrous and hemorrhagic, with giant cells, chronic inflammatory cells, and hemosiderin-laden macrophages. There is no endothelial lining."],
      ["Molecular Biology","Primary ABC is associated with USP6 (TRE17) rearrangement/upregulation. Secondary ABC change within another tumor does not show the same characteristic alteration."],
      ["Differential","A solid variant exists. Radiologic-pathologic correlation is important because giant cell-rich and hemorrhagic lesions can mimic one another."]
    ],
    "Treatment":[
      ["Standard Approach","Many surgically treated ABCs undergo extended intralesional curettage, commonly with a high-speed burr and selective use of local adjuvants."],
      ["Percutaneous Options","Sclerotherapy, selective embolization, and other percutaneous strategies may be useful in selected lesions, especially in difficult anatomic locations."],
      ["Structural Management","Bone graft or substitute and fixation are considered when the defect compromises structural integrity or when fracture is present."],
      ["NP / Clinic Workflow","Track pain, swelling, fracture status, neurologic symptoms for spinal lesions, postoperative healing, and recurrence on interval imaging."]
    ],
    "Prognosis":[
      ["Prognosis","ABC has no conventional metastatic potential but can be locally aggressive and recur after treatment."],
      ["Recurrence","Recurrence risk is highest in younger patients and incompletely treated lesions; close local surveillance is most important during the early postoperative period."],
      ["Follow-up","Serial radiographs are commonly used, with MRI or CT when recurrence or complex anatomy is a concern."]
    ],
    "Exam":[
      ["How to Assess","Inspect for swelling or deformity, palpate for tenderness, assess adjacent joint range of motion, and evaluate weight-bearing or limb function."],
      ["Spine Examination","For spinal lesions, document motor strength, sensation, reflexes, gait, and any radicular symptoms or bowel/bladder red flags."],
      ["Fracture Assessment","Acute pain escalation, deformity, or loss of function should prompt evaluation for pathologic fracture."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 9: Benign Radiolucent Lesions — Aneurysmal Bone Cyst.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Aneurysmal bone cyst reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="ubc">Unicameral Bone Cyst</button><button data-detail="gct">Giant Cell Tumor of Bone</button><button data-detail="chondroblastoma">Chondroblastoma</button></div>`]
    ]
  }
},

gct:{
  badges:["Intermediate","Bone","Giant-cell rich"],
  tabs:{
    "Overview":[
      ["At a Glance","Giant cell tumor of bone (GCTB) is a benign but locally aggressive tumor with a real risk of local recurrence and a rare ability to metastasize to the lungs despite benign histology."],
      ["Epidemiology & Location","Peak incidence is in the third to fourth decades. GCTB favors the metaphyseal-epiphyseal region of long bones after physeal closure, especially around the knee: distal femur and proximal tibia, followed by the distal radius."],
      ["Clinical Pearl","A skeletally mature patient with an eccentric lytic lesion extending to the subchondral bone should make GCTB a leading consideration.","pearl"],
      ["Red Flag","Benign GCTB can metastasize to lung, and local recurrence is not uncommon. It should not be treated as an ordinary latent benign lesion.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Pain usually begins insidiously as a dull ache and gradually worsens. Swelling, joint fullness, reduced motion, and a painful limp may develop."],
      ["Pathologic Fracture","Approximately 20% present with pathologic fracture, often after a period of progressive pain and decreased motion."],
      ["Spine","Spinal lesions may produce radicular symptoms depending on location and extent."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Age</b><span>Skeletally mature; 3rd–4th decades</span></div><div class="sig"><b>Location</b><span>Metaphyseal-epiphyseal</span></div><div class="sig"><b>Subchondral</b><span>Extends to articular surface</span></div><div class="sig"><b>Matrix</b><span>No mineralized matrix</span></div><div class="sig"><b>Margin</b><span>Usually no thick sclerotic rim</span></div><div class="sig"><b>MRI</b><span>Solid enhancing lesion</span></div></div>`],
      ["Plain Radiographs","GCTB is usually a radiolucent metaphyseal-epiphyseal lesion, commonly without sclerosis. It may become large, expand cortex, erode bone, and reach the subchondral surface."],
      ["MRI","MRI is preferred for local staging and surgical planning. T1 signal is typically low-to-intermediate; T2 signal may be heterogeneous because of hemosiderin and variable water content. The lesion enhances as a solid tumor."],
      ["CT","CT can clarify cortical erosion, fracture, joint involvement, and the lack of matrix mineralization."],
      ["Imaging Pearl","The combination of skeletally mature age, eccentric epiphyseal extension, subchondral involvement, and absent matrix is classic.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/giant-cell-tumour-of-bone" target="_blank" rel="noopener noreferrer">Radiopaedia: Giant cell tumor of bone ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","GCTB contains neoplastic fibroblast-like stromal cells, monocyte precursors, and numerous osteoclast-like multinucleated giant cells distributed throughout the lesion."],
      ["Tumor Biology","The stromal cells overexpress RANKL, driving osteoclastogenesis and bone resorption. Most GCTBs harbor H3F3A mutations such as G34W or G34L."],
      ["Diagnostic Pearl","Giant cells alone do not establish the diagnosis; the differential includes aneurysmal bone cyst, chondroblastoma, and giant cell-rich osteosarcoma."]
    ],
    "Treatment":[
      ["Preferred Local Treatment","Extended intralesional curettage, with or without local adjuvants, is generally preferred when technically feasible."],
      ["Wide Resection","En bloc resection lowers recurrence but can sacrifice more function, so it is usually reserved for lesions where curettage is unlikely to provide adequate local control or structural preservation."],
      ["Denosumab","Denosumab inhibits RANKL-mediated osteoclast activation, can relieve pain and induce bone formation, and may help in selected unresectable or high-morbidity cases. Its impact on recurrence around curettage remains controversial."],
      ["NP / Clinic Workflow","Track local symptoms, function, interval imaging, chest surveillance, and treatment complications. For denosumab-treated patients, monitor multidisciplinary plans carefully because treatment alters imaging and pathology."]
    ],
    "Prognosis":[
      ["Local Recurrence","Modern local recurrence rates are roughly 10%–30%, with the highest risk in the first 24 months after treatment."],
      ["Pulmonary Metastasis","Benign GCTB can metastasize to the lungs in a small minority of patients, so chest surveillance is part of follow-up."],
      ["Surveillance","Follow both the local site and chest. MRI is useful when radiographs are equivocal for recurrence around a postoperative cavity."]
    ],
    "Exam":[
      ["How to Assess","Evaluate pain, swelling, joint effusion or fullness, range of motion, gait, and weight-bearing tolerance. Palpate for a soft-tissue component if present."],
      ["Fracture / Structural Assessment","Document acute tenderness, deformity, instability, or inability to bear weight when fracture is suspected."],
      ["Neurovascular / Spine","Perform a complete distal neurovascular exam; for spinal disease, document motor, sensory, reflexes, gait, and radicular findings."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 13: Giant Cell Tumor of Bone.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Giant cell tumor of bone reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="abc">Aneurysmal Bone Cyst</button><button data-detail="chondroblastoma">Chondroblastoma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},

lipoma:{
  badges:["Benign","Soft Tissue","Adipocytic"],
  tabs:{
    "Overview":[
      ["At a Glance","Lipoma is a benign tumor composed of mature adipose tissue and is the most common mesenchymal soft-tissue tumor."],
      ["Location","Lipomas may be superficial or deep to the fascia. Superficial lesions are much more common and are frequently found on the back, shoulders, posterior neck, abdomen, and proximal extremities."],
      ["Clinical Pearl","A small, superficial, soft, mobile, slowly growing painless mass is the classic presentation of lipoma.","pearl"],
      ["Red Flag","A deep fatty mass, a lesion larger than 5 cm, rapid or continued growth, or atypical MRI features should prompt more careful evaluation for atypical lipomatous tumor or another diagnosis.","red"]
    ],
    "Presentation":[
      ["Superficial Lipoma","Usually a small, slowly enlarging, painless subcutaneous mass with a rubbery consistency and good mobility."],
      ["Deep Lipoma","Deep lesions may present as fullness or may be discovered incidentally on imaging. They are often substantially larger before detection."],
      ["Symptoms","Pain is uncommon unless the lesion compresses or interferes with an adjacent structure such as a nerve. Cosmetic asymmetry is a common reason for presentation."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>CT</b><span>Homogeneous fat attenuation</span></div><div class="sig"><b>MRI</b><span>Signal matches subcutaneous fat</span></div><div class="sig"><b>T1</b><span>High fat signal</span></div><div class="sig"><b>Fascia</b><span>Superficial or deep</span></div><div class="sig"><b>Concern</b><span>Large / deep / thick septa / nodules</span></div><div class="sig"><b>Limitation</b><span>MRI cannot always separate lipoma from ALT</span></div></div>`],
      ["MRI","MRI usually shows a homogeneous mass with signal characteristics matching subcutaneous fat. Heterogeneity can occur from necrosis, calcification, or prominent septa."],
      ["When MRI Is Important","Lesions deep to fascia or greater than 5 cm should generally be evaluated with MRI to confirm lipomatous characteristics."],
      ["Imaging Pearl","MRI confirms a fatty tumor well, but it does not reliably distinguish every lipoma from atypical lipomatous tumor.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/lipoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Lipoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Gross Pathology","Lipomas are typically well-circumscribed yellow to orange fatty masses; superficial lesions are often encapsulated, while deep lesions may conform to the compartment in which they grow."],
      ["Histology","Conventional lipoma is composed of mature adipocytes resembling normal fat."],
      ["Lipoma vs ALT","When morphology and imaging are equivocal, MDM2 amplification testing can help distinguish atypical lipomatous tumor from benign lipoma."]
    ],
    "Treatment":[
      ["Observation","Small asymptomatic superficial lipomas can often be observed."],
      ["Indications for Excision","Excision may be chosen for symptoms, continued growth, larger size, compression of adjacent structures, or cosmetic concerns."],
      ["Surgery","Marginal excision is the standard surgical treatment and is usually curative."],
      ["Referral","Deep, large, recurrent, or diagnostically uncertain lipomatous masses should be evaluated carefully and may warrant orthopaedic oncology referral before excision."]
    ],
    "Prognosis":[
      ["Prognosis","Lipomas have an indolent course. Many stabilize after an initial period of growth."],
      ["Recurrence","Recurrence after excision is uncommon and is usually related to incomplete resection, particularly in poorly encapsulated or infiltrative lesions."],
      ["Malignant Change","True malignant degeneration of a conventional lipoma is exceedingly rare, if it occurs at all. Routine postoperative imaging surveillance is generally unnecessary after complete excision of a confirmed lipoma."]
    ],
    "Exam":[
      ["How to Assess","Document size, depth, mobility, tenderness, skin changes, relation to nearby joints, and whether the mass seems fixed to deeper structures."],
      ["Neurovascular / Compression","Check motor and sensory function when the mass lies near a peripheral nerve and assess for vascular compromise when anatomically relevant."],
      ["Red Flags on Exam","Deep fixation, rapid growth, neurologic symptoms, or a very large mass should prompt imaging and specialist evaluation rather than simple office excision."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 23: Lipoma and Other Benign Lipomatous Tumors.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Lipoma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="alt">Atypical Lipomatous Tumor</button><button data-route="imaging">Soft-Tissue Masses</button></div>`]
    ]
  }
},

nof:{
  badges:["Benign","Bone","Fibrous"],
  tabs:{
    "Overview":[
      ["At a Glance","Nonossifying fibroma (NOF) is a common benign fibrous lesion of the immature skeleton. It is typically eccentric and metaphyseal and is most often discovered incidentally."],
      ["Epidemiology & Location","About 80% occur in patients younger than 20 years. Common sites include the distal femur, proximal tibia, distal tibia, and proximal fibula."],
      ["Clinical Pearl","A classic eccentric metaphyseal, lobulated, sclerotic-rimmed lesion in a child or adolescent can often be diagnosed on plain radiographs without biopsy.","pearl"],
      ["Red Flag","Pain attributed to an NOF without fracture or acute injury should prompt reconsideration of the diagnosis or evaluation for another process.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Most NOFs are asymptomatic incidental findings. Symptoms usually arise when a pathologic fracture occurs."],
      ["Physical Exam","The examination is generally normal unless fracture or a large symptomatic lesion is present."],
      ["Fracture Risk","Larger lesions can weaken bone. Assess pain, cortical involvement, lesion size, activity demands, and any evidence of pathologic fracture."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Age</b><span>Usually &lt;20 years</span></div><div class="sig"><b>Location</b><span>Eccentric metaphysis</span></div><div class="sig"><b>Shape</b><span>Longer than wide; lobulated</span></div><div class="sig"><b>Margin</b><span>Sclerotic rind</span></div><div class="sig"><b>Internal</b><span>Septations / bubbly appearance</span></div><div class="sig"><b>Evolution</b><span>Increasing sclerosis with maturation</span></div></div>`],
      ["Plain Radiographs","NOFs are eccentric metaphyseal lesions with lobulated margins, internal septation, and a sclerotic rim. Smaller fibrous cortical defects are predominantly cortical; larger NOFs extend more deeply."],
      ["CT / MRI","Cross-sectional imaging is seldom needed for a classic lesion. CT can demonstrate cortical thinning. MRI reflects fibrous tissue and may contain areas related to hemosiderin."],
      ["Imaging Pearl","The classic radiographic appearance plus the patient's age is often sufficient; unnecessary biopsy can be avoided.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/non-ossifying-fibroma-1" target="_blank" rel="noopener noreferrer">Radiopaedia: Nonossifying fibroma ↗</a></div>`]
    ],
    "Pathology":[
      ["Biology","NOFs have historically been considered developmental/reactive lesions, but molecular studies identifying KRAS, FGFR1, and NF1 alterations support RAS-MAPK pathway activation in many lesions."],
      ["Natural History","NOFs and fibrous cortical defects typically mineralize or ossify as skeletal maturity approaches."]
    ],
    "Treatment":[
      ["Observation","Observation is appropriate for the typical asymptomatic lesion when fracture risk is low."],
      ["When to Intervene","Treatment is considered when symptoms develop or the lesion creates meaningful risk of pathologic fracture. The objective is restoration of structural integrity and function."],
      ["NP / Clinic Workflow","Confirm classic imaging, document pain and function, review cortical involvement and fracture risk, and follow larger lesions radiographically until reassuring maturation or healing."]
    ],
    "Prognosis":[
      ["Prognosis","The natural history is favorable. Many lesions regress and progressively ossify with skeletal maturity."],
      ["Follow-up","Follow-up is driven by lesion size, structural risk, symptoms, and skeletal maturity rather than oncologic metastatic risk."]
    ],
    "Exam":[
      ["How to Assess","Inspect for swelling or deformity, palpate for focal tenderness, assess adjacent joint motion and gait or extremity function, and look for signs of fracture."],
      ["Normal / Reassuring","A classic incidental NOF often has a completely normal physical examination."],
      ["Abnormal Findings","New focal pain, inability to bear weight, deformity, or acute tenderness should raise concern for fracture or an alternate diagnosis."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 12: Benign Fibrous Lesions and Langerhans Cell Histiocytosis — Nonossifying Fibroma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Nonossifying fibroma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="fibrous-dysplasia">Fibrous Dysplasia</button><button data-detail="cmf">Chondromyxoid Fibroma</button></div>`]
    ]
  }
},

"fibrous-dysplasia":{
  badges:["Benign","Bone","Fibrous"],
  tabs:{
    "Overview":[
      ["At a Glance","Fibrous dysplasia is a developmental fibro-osseous disorder in which normal marrow and cancellous bone are replaced by abnormal fibrous and fibro-osseous tissue."],
      ["Forms","Disease may be monostotic (one bone) or polyostotic (multiple bones). Monostotic disease accounts for about 70% of cases and is commonly recognized before age 30."],
      ["Syndromic Associations","Fibrous dysplasia may occur with McCune-Albright syndrome or Mazabraud syndrome."],
      ["Clinical Pearl","The classic radiographic clue is a ground-glass matrix with a sharp geographic interface to normal bone.","pearl"],
      ["Red Flag","Rapid new growth, a new soft-tissue mass, or a major change in pain deserves evaluation. Malignant transformation is rare, and prior radiation increases that risk.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Fibrous dysplasia is often incidental but can present with bone pain, swelling, tenderness, stress fracture, deformity, or pathologic fracture."],
      ["Common Sites","Frequently affected bones include the femur, tibia, pelvis, foot, and craniofacial skeleton."],
      ["Deformity","Repeated fracture and remodeling in the proximal femur may produce the classic shepherd's crook deformity."],
      ["Systemic Clues","In polyostotic disease, ask about endocrine abnormalities and café-au-lait pigmentation. Soft-tissue myxomas are associated with Mazabraud syndrome."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Matrix</b><span>Ground-glass</span></div><div class="sig"><b>Border</b><span>Sharp geographic interface</span></div><div class="sig"><b>Location</b><span>Diaphysis / metaphysis common</span></div><div class="sig"><b>Structure</b><span>Normal trabeculae replaced</span></div><div class="sig"><b>Deformity</b><span>Shepherd's crook may develop</span></div><div class="sig"><b>MRI</b><span>T1 low; T2 often increased signal</span></div></div>`],
      ["Plain Radiographs","The normal trabecular pattern is replaced by woven bone and fibrous tissue, producing the classic ground-glass appearance. The lesion typically has a sharp geographic border."],
      ["MRI / Bone Scan","MRI commonly shows decreased T1 signal and increased T2 signal. Technetium bone scanning may show mild-to-moderate uptake and can help define skeletal burden in multifocal disease."],
      ["Imaging Pearl","Recognize the ground-glass matrix and overall benign geographic behavior before escalating to biopsy.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/fibrous-dysplasia" target="_blank" rel="noopener noreferrer">Radiopaedia: Fibrous dysplasia ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","Fibrous dysplasia contains low-cellularity fibrous stroma with scattered curvilinear woven-bone spicules, classically described as an “alphabet soup” pattern."],
      ["Biology","The disorder is associated with a postzygotic signaling mutation affecting osteoblastic precursor cells, producing mosaic disease with variable skeletal involvement."]
    ],
    "Treatment":[
      ["Conservative Management","Management is generally conservative. The principal goals are preventing or correcting deformity and maintaining function."],
      ["Surgical Indications","Persistent pain, deformity, nonunion, and fracture are indications for surgical consideration. Structural restoration is more important than trying to remove all dysplastic bone."],
      ["Bone Grafting","Cancellous graft may be resorbed or replaced by dysplastic tissue; when graft is required, structural cortical graft may be more durable in selected cases."],
      ["NP / Clinic Workflow","Monitor pain, deformity, fracture risk, alignment, and interval imaging. In polyostotic or syndromic disease, coordinate relevant multidisciplinary evaluation."]
    ],
    "Prognosis":[
      ["Natural History","Disease burden ranges from a stable monostotic lesion to extensive polyostotic deformity and disability."],
      ["Malignant Transformation","Malignant transformation is rare. OKU reports approximately 0.5–1% for monostotic disease and a higher rate in polyostotic/McCune-Albright disease; radiation to involved bone increases risk."],
      ["Follow-up","Follow symptoms, deformity, fracture risk, and imaging behavior. New aggressive features require reassessment."]
    ],
    "Exam":[
      ["How to Assess","Inspect limb alignment and length, assess gait, palpate symptomatic areas, measure adjacent joint motion, and evaluate for deformity or signs of stress/pathologic fracture."],
      ["Proximal Femur","Assess hip motion, limb alignment, gait, and progressive varus deformity when proximal femoral disease is present."],
      ["Syndromic Examination","When clinically appropriate, note café-au-lait lesions and other findings that may support a syndromic presentation, while coordinating systemic evaluation with the appropriate specialists."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 12: Benign Fibrous Lesions and Langerhans Cell Histiocytosis — Fibrous Dysplasia.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Fibrous dysplasia reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="nof">Nonossifying Fibroma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},

ubc:{
  badges:["Benign","Bone","Cystic"],
  tabs:{
    "Overview":[
      ["At a Glance","Unicameral bone cyst (UBC), also called a simple or solitary bone cyst, is a fluid-filled benign cystic lesion of the immature skeleton. It most commonly involves the proximal humerus and proximal femur."],
      ["Epidemiology","UBCs usually occur in the first two decades of life and have an approximately 2:1 male predominance."],
      ["Clinical Pearl","A central metaphyseal lucent lesion in a child with a fallen leaf fragment after fracture is classic for UBC.","pearl"],
      ["Red Flag","Proximal femoral UBCs deserve particular attention because fracture can have major mechanical consequences in a weight-bearing location.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Many UBCs are painless and incidental, but pathologic fracture can occur in up to two-thirds of patients and may be the first presentation."],
      ["Symptoms","Large lesions at risk for fracture may be painful. Acute pain after trauma should prompt evaluation for pathologic fracture."],
      ["Common Sites","The proximal humerus and proximal femur are classic sites in children. Adult lesions are less common and may occur in locations such as the calcaneus or ilium."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Location</b><span>Central metaphysis</span></div><div class="sig"><b>Pattern</b><span>Lucent, usually single chamber</span></div><div class="sig"><b>Expansion</b><span>Mild; usually not wider than physis</span></div><div class="sig"><b>Cortex</b><span>Thinned, no soft-tissue mass</span></div><div class="sig"><b>Fracture Sign</b><span>Fallen leaf fragment</span></div><div class="sig"><b>MRI</b><span>Homogeneous fluid signal</span></div></div>`],
      ["Plain Radiographs","UBC is typically a central metaphyseal lucent cyst. Mild expansion can occur, but usually not beyond the width of the adjacent physis. The cortex is thinned without a soft-tissue mass."],
      ["Fallen Leaf Sign","After fracture, a cortical fragment may fall into the fluid cavity. This classic fallen leaf sign strongly supports a UBC."],
      ["CT / MRI","CT can better define cortical thinning, fracture, and fallen fragments. MRI shows homogeneous fluid signal; without fracture, fluid-fluid levels are usually absent."],
      ["Imaging Pearl","UBC is central and only mildly expansile; ABC is generally more expansile and may demonstrate fluid-fluid levels.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/simple-bone-cyst" target="_blank" rel="noopener noreferrer">Radiopaedia: Simple bone cyst ↗</a></div>`]
    ],
    "Pathology":[
      ["Gross / Fluid","The cavity typically contains straw-colored proteinaceous fluid. It becomes bloody when a pathologic fracture has occurred."],
      ["Histology","The wall is a thin fibrous lining without epithelial or endothelial components. Bland fibroblastic cells, scattered giant cells, mesenchymal cells, and lymphocytes may be present."],
      ["UBC vs ABC","Large blood-filled spaces characteristic of aneurysmal bone cyst are absent in an uncomplicated UBC."]
    ],
    "Treatment":[
      ["Observation","A painless lesion with low fracture concern can be observed. Activity modification may be considered when fracture risk is meaningful."],
      ["When to Treat","Pain, substantial structural risk, or pathologic fracture generally prompts consideration of treatment."],
      ["Options","Management options include aspiration/injection, autologous bone marrow injection, curettage with or without graft or substitute, and percutaneous decompression, with or without intramedullary fixation."],
      ["Fracture Considerations","Upper-extremity pathologic fractures are often allowed to heal before deciding on cyst treatment. Proximal femoral lesions may warrant a more aggressive prophylactic approach because of weight-bearing fracture risk."],
      ["NP / Clinic Workflow","Document pain, activity, fracture history, lesion size and location, cortical thinning, and weight-bearing risk; monitor healing and recurrence after treatment."]
    ],
    "Prognosis":[
      ["Natural History","UBCs may persist despite skeletal maturation. A fracture can occasionally stimulate healing, but complete involution after fracture is not reliable."],
      ["Treatment Expectations","No single intervention is universally optimal. Percutaneous approaches may require repeat procedures, and recurrence or incomplete healing is possible."],
      ["Follow-up","Serial radiographs are used to evaluate cyst healing, cortical restoration, fracture healing, and recurrence."]
    ],
    "Exam":[
      ["How to Assess","Assess focal tenderness, swelling, range of motion, gait or upper-extremity use, and pain with loading. Examine carefully for signs of pathologic fracture."],
      ["Fracture Assessment","Acute pain, deformity, inability to bear weight/use the limb, or marked tenderness requires prompt fracture evaluation."],
      ["Neurovascular Check","Document distal motor, sensory, pulses, and perfusion when fracture or significant expansion is present."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 9: Benign Radiolucent Lesions — Unicameral Bone Cyst.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Simple bone cyst reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="abc">Aneurysmal Bone Cyst</button><button data-detail="nof">Nonossifying Fibroma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},

cmf:{
  badges:["Benign","Bone","Cartilage"],
  tabs:{
    "Overview":[
      ["At a Glance","Chondromyxoid fibroma (CMF) is a rare benign cartilage-lineage bone tumor, accounting for less than 1% of bone lesions. It most often affects adolescents and young adults and commonly involves the long bones."],
      ["Typical Location","CMF is usually eccentric and metaphyseal, often mildly expansile, with the long axis paralleling the bone. Long bones are most common, though axial and flat-bone lesions also occur."],
      ["Clinical Pearl","Persistence of an eccentric, lobulated metaphyseal lesion beyond skeletal maturity helps separate CMF from a typical nonossifying fibroma.","pearl"],
      ["Red Flag","Cortical erosion and expansion can occur in a benign CMF. Imaging aggressiveness alone should not be equated with malignancy, but atypical features require careful correlation.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Pain, often present for a long period, is the most common symptom. Soft-tissue swelling may occur and a palpable mass is less common. Some axial lesions are incidental."],
      ["What to Ask","Duration and progression of pain, swelling, functional limitation, prior imaging, and whether symptoms have changed over time."],
      ["What to Examine","Palpate for focal tenderness or swelling, assess adjacent joint motion and function, and document neurovascular status when the lesion is near major structures."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Age</b><span>2nd–3rd decades most common</span></div><div class="sig"><b>Location</b><span>Eccentric metaphyseal lesion</span></div><div class="sig"><b>Margin</b><span>Well defined, often sclerotic rim</span></div><div class="sig"><b>Shape</b><span>Lobulated; long axis parallels bone</span></div><div class="sig"><b>Architecture</b><span>Pseudotrabeculation may be present</span></div><div class="sig"><b>Cortex</b><span>Mild expansion / cortical erosion possible</span></div></div>`],
      ["What to Recognize","A well-marginated, eccentric, mildly expansile metaphyseal lesion with a sclerotic rim and lobulated contour. It can resemble a nonossifying fibroma."],
      ["CT / MRI","Cross-sectional imaging helps define cortical integrity, extent, and soft-tissue involvement when radiographs are indeterminate or the lesion is in an axial location."],
      ["Imaging Pearl","CMF can be radiographically indistinguishable from a nonossifying fibroma. Patient age, persistence after skeletal maturity, location, and pathology resolve difficult cases.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/chondromyxoid-fibroma" target="_blank" rel="noopener noreferrer">Radiopaedia: Chondromyxoid fibroma ↗</a></div>`]
    ],
    "Pathology":[
      ["Pathology","CMF is a lobulated lesion with chondroid, myxoid, and fibrous areas. Its histologic appearance can overlap with other cartilage lesions, so radiologic-pathologic correlation is important."],
      ["Genetics","Abnormalities involving chromosome 6q13 and the COL12A1 region have been described in CMF."]
    ],
    "Treatment":[
      ["Management","Symptomatic or structurally concerning lesions are typically treated with intralesional curettage. The defect may be managed with graft or another void filler depending on location and size."],
      ["NP / Clinic Workflow","Track pain, interval imaging change, cortical integrity, and postoperative recurrence. Escalate unexpected progression or discordant imaging/pathology for multidisciplinary review."]
    ],
    "Prognosis":[
      ["Prognosis","CMF is benign. Local recurrence can occur, especially after incomplete intralesional removal, so postoperative surveillance is appropriate."],
      ["Follow-up","Follow local symptoms and serial radiographs after treatment; tailor duration to lesion location, surgical margin, and recurrence risk."]
    ],
    "Exam":[
      ["How to Assess","Inspect and palpate the involved region, identify focal bony tenderness or swelling, compare adjacent joint range of motion, and assess function."],
      ["Neurovascular Check","Document distal motor, sensory, pulses, and perfusion when the lesion is near major neurovascular structures."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 10: Benign Cartilage Lesions — Chondromyxoid Fibroma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Chondromyxoid fibroma reference article. Images are linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="chondroblastoma">Chondroblastoma</button><button data-detail="enchondroma">Enchondroma</button><button data-detail="nof">Nonossifying Fibroma</button></div>`]
    ]
  }
},

"osteoid-osteoma":{
  badges:["Benign","Bone","Bone-forming"],
  tabs:{
    "Overview":[
      ["At a Glance","Osteoid osteoma is a benign osteoid-producing bone tumor defined by a small nidus, typically less than 1.5 cm, surrounded by reactive sclerosis."],
      ["Epidemiology & Location","Peak incidence is in the second decade; most patients are 5–25 years old and males are affected more often. At least half arise in long bones of the lower extremity; the upper extremity and posterior elements of the spine are also common."],
      ["Clinical Pearl","Classic nocturnal or rest pain that improves rapidly with aspirin or NSAIDs is one of the strongest diagnostic clues.","pearl"],
      ["Red Flag","Marked edema on MRI may look infectious or malignant. Always correlate with radiographs or CT before overcalling the lesion.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Severe focal pain, often described as toothache-like, occurs at rest and at night. Temporary rapid relief with NSAIDs or aspirin is characteristic."],
      ["Why NSAIDs Help","Osteoid osteomas produce high levels of prostaglandins; cyclo-oxygenase inhibition explains the typical analgesic response."],
      ["Atypical Presentations","Intra-articular lesions may produce synovitis, stiffness, or less classic pain. Spinal lesions may present with painful scoliosis or focal symptoms depending on location."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Nidus</b><span>Usually &lt;1.5 cm</span></div><div class="sig"><b>Center</b><span>Lucent focus ± central mineralization</span></div><div class="sig"><b>Reaction</b><span>Prominent reactive sclerosis common</span></div><div class="sig"><b>Best Test</b><span>Thin-section CT for nidus localization</span></div><div class="sig"><b>MRI</b><span>Can show striking edema</span></div><div class="sig"><b>Bone Scan</b><span>Highly sensitive when needed</span></div></div>`],
      ["Plain Radiographs","A small central lucency surrounded by reactive sclerosis is highly suggestive in the correct clinical setting. Heavy sclerosis may obscure the nidus."],
      ["CT","High-resolution CT is often the most useful modality to show the nidus and its exact relationship to cortex and surrounding bone."],
      ["MRI","MRI may demonstrate disproportionate marrow and soft-tissue edema from the inflammatory response and can mimic infection or malignancy."],
      ["Imaging Pearl","When MRI looks much more aggressive than expected, look for the tiny nidus on CT.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/osteoid-osteoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Osteoid osteoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","The nidus contains interlacing trabeculae of immature bone lined by osteoblasts within a vascular fibrous stroma, with no normal marrow elements in the nidus."],
      ["Biology","Osteoid osteoma has limited growth potential and no malignant potential."]
    ],
    "Treatment":[
      ["Observation / Medication","Selected patients with tolerable symptoms may be managed with NSAIDs; spontaneous clinical resolution or “burnout” can occur over time."],
      ["Standard Treatment","CT-guided percutaneous radiofrequency ablation of the nidus is a standard minimally invasive treatment when intervention is needed."],
      ["Surgery","Open or limited surgical excision remains useful when ablation is unsuitable or when anatomy makes percutaneous treatment unsafe."],
      ["NP / Clinic Workflow","Confirm classic symptom pattern and CT localization, review proximity to nerves, skin, joint, and growth plate, then monitor post-procedure pain resolution and recurrence."]
    ],
    "Prognosis":[
      ["Prognosis","Complete nidus destruction or removal is usually curative, with rapid relief of the characteristic pain."],
      ["Recurrence","Persistent or recurrent pain after treatment should prompt evaluation for residual or recurrent nidus."]
    ],
    "Exam":[
      ["How to Assess","Localize focal tenderness, assess adjacent joint motion, gait, and functional limitation, and look for muscle atrophy or protective posture in chronic cases."],
      ["Spinal Lesions","Document alignment, painful scoliosis if present, neurologic status, and focal paraspinal tenderness."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 11: Benign Bone-Forming Tumors — Osteoid Osteoma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Osteoid osteoma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="osteoblastoma">Osteoblastoma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},

osteoblastoma:{
  badges:["Benign","Bone","Bone-forming"],
  tabs:{
    "Overview":[
      ["At a Glance","Osteoblastoma is a benign osteoid-producing tumor related to osteoid osteoma but with greater growth potential. It is typically larger than 1.5 cm and does not usually have the classic nocturnal NSAID-responsive pain pattern."],
      ["Epidemiology & Location","It is rare, accounting for less than 1% of biopsied bone tumors. Peak incidence is in the second decade, with a male predominance. More than half involve the axial skeleton, especially posterior elements of the spine, sacrum, and skull."],
      ["Clinical Pearl","Think osteoblastoma when an osteoid-producing lesion resembles an osteoid osteoma but is larger than 1.5 cm, medullary rather than cortical, and has less classic pain.","pearl"],
      ["Red Flag","Aggressive osteoblastoma can mimic osteosarcoma radiographically and histologically. Large destructive lesions require careful multidisciplinary correlation.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Pain is common but often lacks the classic nocturnal pattern and dramatic NSAID response of osteoid osteoma. Larger lesions may cause structural weakness."],
      ["Spine","Posterior-element lesions may produce focal back pain, stiffness, deformity, radicular symptoms, or neurologic findings depending on size and location."],
      ["Secondary ABC","Secondary aneurysmal bone cyst formation may cause rapid enlargement and more destructive imaging features."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Size</b><span>Usually &gt;1.5 cm</span></div><div class="sig"><b>Pattern</b><span>Well-defined lytic lesion with reactive rim</span></div><div class="sig"><b>Matrix</b><span>Variable osteoid mineralization</span></div><div class="sig"><b>Location</b><span>Medullary; posterior spine common</span></div><div class="sig"><b>Aggressive Form</b><span>May exceed 4 cm with expansion/destruction</span></div><div class="sig"><b>Best Detail</b><span>Radiographs + CT</span></div></div>`],
      ["CT","CT is especially useful for showing osteoid matrix, lesion margins, cortical change, and anatomy in the spine."],
      ["MRI","MRI can overstate aggressiveness because of substantial inflammatory marrow and soft-tissue response."],
      ["Differential","Key distinctions include osteoid osteoma (smaller, classic NSAID-responsive night pain) and osteosarcoma (malignant permeative behavior / atypia)."],
      ["Imaging Pearl","For suspected osteoblastoma, radiographs and CT usually characterize the lesion better than MRI alone.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/osteoblastoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Osteoblastoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","Osteoblastoma contains a complex network of osteoid trabeculae lined by large but uniform osteoblasts within a cellular vascular stroma. Giant cells may be present."],
      ["Aggressive Osteoblastoma","Epithelioid osteoblasts and more aggressive architecture may be seen, but true cytologic atypia should raise concern for osteosarcoma."],
      ["Genetics","Recurrent FOS or FOSB rearrangements support the neoplastic nature of osteoblastoma and its relationship to osteoid osteoma."]
    ],
    "Treatment":[
      ["Standard Treatment","Complete surgical removal is preferred. Extended intralesional curettage with a high-speed burr is commonly used for accessible lesions."],
      ["Local Control","Thermal or chemical adjuvants may be used to improve local control following intralesional excision."],
      ["Aggressive Lesions","Wide resection is favored for aggressive osteoblastoma when clinically feasible because recurrence risk is higher."],
      ["NP / Clinic Workflow","Track pain, neurologic symptoms for spinal lesions, postoperative imaging, structural stability, and recurrence. Escalate new growth or discordant pathology promptly."]
    ],
    "Prognosis":[
      ["Recurrence","Local recurrence can approach 25% after simple intralesional curettage; more complete local treatment lowers this risk."],
      ["Aggressive Variant","Aggressive osteoblastoma carries a greater local recurrence risk and requires closer surveillance."],
      ["Malignancy","Benign osteoblastoma itself is not managed as a sarcoma, but distinction from osteosarcoma is essential in aggressive-appearing cases."]
    ],
    "Exam":[
      ["How to Assess","Examine the involved region for focal tenderness, deformity, swelling, and functional limitation. Assess adjacent joints when appendicular."],
      ["Spine Examination","Document spinal alignment, tenderness, range of motion, motor strength, sensation, reflexes, and gait when the lesion involves the spine."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 11: Benign Bone-Forming Tumors — Osteoblastoma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Osteoblastoma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="osteoid-osteoma">Osteoid Osteoma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},
chondroblastoma:{
  badges:["Benign","Bone","Cartilage"],
  tabs:{
    "Overview":[
      ["At a Glance","Chondroblastoma is a rare benign cartilage neoplasm that characteristically arises in the epiphysis or apophysis of young patients. Most lesions are unifocal and occur in long bones."],
      ["Epidemiology & Location","It most often presents in the second and early third decades of life. Common sites include the proximal and distal femur, proximal tibia, and proximal humerus. Less common sites include the patella, talus, calcaneus, pelvis, and other flat bones."],
      ["Clinical Pearl","In a young patient with a painful, well-defined epiphyseal or apophyseal lucent lesion, chondroblastoma should be high on the differential.","pearl"],
      ["Red Flag","Although benign, chondroblastoma can behave aggressively locally, recur after treatment, and very rarely metastasize to the lungs.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Pain is the most common presenting symptom and may be longstanding. Because many lesions are near a joint, patients may also report swelling, stiffness, joint effusion, and restricted motion."],
      ["What to Ask","Duration and progression of pain; activity and rest symptoms; swelling; loss of motion; mechanical symptoms; prior procedures; and symptoms suggesting pathologic fracture."],
      ["What to Examine","Inspect for swelling or effusion, palpate for focal tenderness, compare active and passive joint motion, assess gait or functional limitation when relevant, and document distal neurovascular status."],
      ["Clinical Pearl","Joint symptoms can dominate the presentation because these tumors often sit directly beneath or near an articular surface.","pearl"]
    ],
    "Imaging":[
      ["Teaching X-ray",`<div class="img-card"><img src="https://nccommons.org/media/4/42/Chondroblastoma_-_distal_femur_%28Radiopaedia_8112-8949_Frontal_1%29.jpg" alt="AP radiograph of the left knee showing a chondroblastoma in the distal femoral epiphysis" loading="lazy" style="display:block;width:auto;max-width:300px;max-height:390px;object-fit:contain;margin:12px auto;border-radius:10px;"><div class="img-caption"><b>Chondroblastoma — distal femur.</b> AP radiograph of the left knee demonstrates a sharply defined lucent lesion centered in the distal femoral epiphysis, with a narrow zone of transition and extension across the open physis. Source: Angela Byrne / Radiopaedia case 8112, mirrored by NC Commons, CC BY-NC-SA 3.0. <a href="https://nccommons.org/wiki/File:Chondroblastoma_-_distal_femur_(Radiopaedia_8112-8949_Frontal_1).jpg" target="_blank" rel="noopener noreferrer">Image source & license ↗</a></div></div>`],
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Age</b><span>Usually teens / young adults</span></div><div class="sig"><b>Location</b><span>Epiphysis or apophysis</span></div><div class="sig"><b>Pattern</b><span>Well-defined lucent lesion</span></div><div class="sig"><b>Margin</b><span>Narrow transition; often thin sclerotic rim</span></div><div class="sig"><b>Matrix</b><span>May show fine or “fluffy” calcification</span></div><div class="sig"><b>Cortex</b><span>Can thin, expand, or rarely breach cortex</span></div><div class="sig"><b>Secondary ABC</b><span>May produce expansion / fluid-fluid levels</span></div><div class="sig"><b>Joint</b><span>Effusion and adjacent edema may be present</span></div></div>`],
      ["What to Recognize","Look for a sharply marginated lytic lesion centered in the epiphysis or apophysis of a young patient. A thin sclerotic rim and internal calcification support the diagnosis. Larger lesions may extend across the physis or develop secondary aneurysmal bone cyst change."],
      ["Plain Radiographs","Radiographs typically show a radiolucent, sharply demarcated epiphyseal or apophyseal lesion, sometimes with a thin sclerotic border. Matrix calcification may be present and can help distinguish chondroblastoma from giant cell tumor."],
      ["CT","CT is useful for showing subtle matrix mineralization, cortical thinning or breach, and lesion relationship to the subchondral bone."],
      ["MRI","MRI can demonstrate marrow and soft-tissue edema, joint effusion, cortical involvement, and secondary aneurysmal bone cyst change. Fluid-fluid levels may be seen when an ABC component is present."],
      ["Imaging Pearl","Age + epiphyseal location + a well-defined lucent lesion is the key pattern. In an older skeletally mature patient, giant cell tumor moves higher on the differential.","pearl"],
      ["Real Cases & Further Imaging",`<div class="ref">Radiopaedia is linked for full case review and scrollable imaging rather than copying its images into OrthoPearls.</div><div class="source-actions"><a href="https://radiopaedia.org/cases/8112" target="_blank" rel="noopener noreferrer">Radiopaedia: distal femur case ↗</a><a href="https://radiopaedia.org/articles/chondroblastoma" target="_blank" rel="noopener noreferrer">Radiopaedia: chondroblastoma reference ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","Chondroblastoma is composed of sheets of chondroblasts with chondroid matrix and frequent osteoclast-type giant cells. Fine pericellular “chicken-wire” calcification is classic."],
      ["Genetics","A lysine-to-methionine substitution at position 36 of histone H3.3, most commonly involving H3F3B, is characteristic and can be detected immunohistochemically with the K36M antibody."],
      ["Secondary Changes","Aneurysmal bone cyst-like areas are common enough to be diagnostically relevant and may account for marked expansion or fluid-fluid levels on imaging."],
      ["Open-License Pathology Image",`<div class="ref"><b>Teaching image available on Wikimedia Commons:</b> very-high-magnification H&E micrograph of chondroblastoma by Nephron. The image is linked rather than embedded here so the app remains lightweight.</div><div class="source-actions"><a href="https://commons.wikimedia.org/wiki/File:Chondroblastoma_-_very_high_mag.jpg" target="_blank" rel="noopener noreferrer">Open pathology image ↗</a></div>`]
    ],
    "Treatment":[
      ["Standard Treatment","Local treatment is typically extended intralesional curettage followed by filling of the defect with graft or another appropriate material. Local adjuvant techniques may be used based on lesion and surgeon preference."],
      ["Radiofrequency Ablation","Percutaneous radiofrequency ablation has been used for selected small lesions, but caution is warranted in larger lesions and those immediately beneath weight-bearing articular surfaces."],
      ["Surgical Considerations","Protect the adjacent physis and articular surface when possible. The treatment plan should account for lesion size, structural integrity, subchondral support, and any secondary ABC component."],
      ["NP / Clinic Workflow","Review symptoms, prior imaging, and interval change; document joint motion and neurovascular status; assess for pathologic fracture or mechanical compromise; and reinforce postoperative surveillance because recurrence is higher than with many other benign cartilage tumors."]
    ],
    "Prognosis":[
      ["Local Recurrence","Recurrence is more common than in many other benign cartilage tumors, particularly with larger lesions or an associated secondary aneurysmal bone cyst component."],
      ["Pulmonary Metastasis","Pulmonary metastasis is exceptionally rare despite the lesion's benign classification. When it occurs, surgical excision may be considered."],
      ["Follow-up","Continued clinical and local radiographic surveillance is appropriate after treatment. The source text also supports periodic chest radiographic surveillance during routine follow-up because of the rare metastatic potential."],
      ["Prognosis Pearl","Most patients do well with appropriate local treatment, but chondroblastoma deserves more structured follow-up than a typical incidental enchondroma.","pearl"]
    ],
    "Exam":[
      ["How to Assess","Position the patient to fully expose the affected joint and compare sides. Inspect for swelling or effusion, palpate for focal tenderness, and measure active and passive range of motion."],
      ["Functional Testing","Assess gait, weight-bearing tolerance, or upper-extremity functional use depending on lesion location. Document pain with motion and any mechanical block."],
      ["Neurovascular Check","Perform and document the regional distal motor, sensory, pulse, and perfusion examination, particularly when there is cortical expansion or a large lesion near neurovascular structures."],
      ["What Abnormal Findings Suggest","Effusion, progressive motion loss, focal bony tenderness, pain with weight bearing, or new functional decline may indicate local progression, secondary ABC change, fracture risk, or articular involvement."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 10: Benign Cartilage Lesions — Chondroblastoma section.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b><br>Chondroblastoma reference article and distal femur case. External links are provided for educational review; Radiopaedia images are not copied into the app.</div>`],
      ["Pathology Image",`<div class="ref"><b>Wikimedia Commons.</b><br>Nephron — Chondroblastoma, very high magnification H&E micrograph.</div>`],

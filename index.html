const metastaticTabs=["Overview & Workup","Common Malignancies","Mechanical Risk / Mirels","Pathologic Fracture","Upper Extremity","Lower Extremity","Pelvis & Acetabulum","Radiation & Systemic Therapy","Postoperative & NP Management"];
function metastaticPage(tab="Overview & Workup"){
  setTop("Metastatic Bone Disease");activeNav("");
  const current=metastaticTabs.includes(tab)?tab:metastaticTabs[0];
  let body="";
  if(current==="Overview & Workup"){
    body=`
      <section class="card">
        <h3>Metastatic Lesion Quick Assessment</h3>
        <div class="flow">
          <div><b>1.</b> Known malignancy? If not, do not assume metastasis.</div>
          <div><b>2.</b> Define location, pain, weight-bearing demand, and structural bone loss.</div>
          <div><b>3.</b> Review plain radiographs and cross-sectional imaging as indicated.</div>
          <div><b>4.</b> Determine solitary vs multiple disease and overall oncologic burden.</div>
          <div><b>5.</b> Ask: fracture present, impending fracture, or mechanically stable?</div>
          <div><b>6.</b> Integrate prognosis, performance status, tumor biology, systemic/radiation options, and goals of care.</div>
          <div><b>7.</b> Decide whether tissue confirmation is required before treatment.</div>
        </div>
      </section>
      <section class="card pearl"><h3>Clinical Pearl</h3><p>Orthopaedic treatment is not based on the X-ray alone. Fracture risk, expected survival, systemic treatment response, functional goals, and the morbidity of delaying oncology care all matter.</p></section>
      <section class="card red"><h3>Red Flag — First Bone Lesion</h3><p>If a bone lesion is the first skeletal site of disease—even in a patient with a known primary cancer—biopsy should be strongly considered before assuming metastatic disease. A second malignancy or primary bone tumor can occur.</p></section>
      <section class="card"><h3>Initial History & Exam</h3><p>Clarify known primary cancer, prior treatment, disease-free interval, current systemic therapy, radiation history, functional status, pain pattern, weight-bearing pain, and neurologic symptoms. Examine the involved limb for tenderness, deformity, joint motion, gait/function, and neurovascular status.</p></section>
      <section class="card"><h3>Imaging Framework</h3><p>Start with high-quality radiographs of the symptomatic bone. Cross-sectional imaging helps define cortical destruction, structural integrity, soft-tissue extension, and surgical anatomy. Whole-body staging is coordinated with the oncology team according to the clinical situation.</p></section>
      <section class="card"><h3>When Biopsy Matters</h3><p>Biopsy may confirm metastatic disease, provide updated receptor or molecular information, or reveal a second diagnosis. It is especially important with a long disease-free interval, treatment-resistant disease, an atypical lesion, or the first site of bony disease.</p></section>
      <section class="card"><h3>Goals of Orthopaedic Oncology Care</h3><p>Prevent or treat skeletal-related events, relieve pain, restore or preserve function, and choose an intervention durable enough for the patient's expected lifespan while minimizing interruption of systemic or radiation therapy.</p></section>`;
  }else if(current==="Common Malignancies"){
    body=`
      <section class="card">
        <h3>Common Malignancies Involving Bone</h3>
        <p>Histology changes almost every part of skeletal-metastasis management: expected survival, lesion biology, vascularity, fracture behavior, sensitivity to radiation/systemic therapy, and the durability needed from reconstruction.</p>
        <div class="flow">
          <div><b>Solid tumors:</b> breast, lung, renal cell, and thyroid carcinoma.</div>
          <div><b>Hematologic malignancies:</b> multiple myeloma and lymphoma. These involve bone differently from classic solid-tumor metastases but are essential in the adult destructive-bone-lesion differential.</div>
          <div><b>Do not diagnose by pattern alone:</b> a first or atypical skeletal lesion may still require biopsy even when the patient has a known cancer history.</div>
        </div>
      </section>

      <section class="card">
        <h3>Breast Cancer</h3>
        <p><b>Why it is high yield:</b> Breast carcinoma is one of the classic bone-seeking malignancies. Skeletal relapse may occur many years after treatment of the primary tumor because dormant breast-cancer cells can persist within the marrow microenvironment.</p>
        <p><b>Bone biology:</b> OKU emphasizes a tumor–bone “vicious cycle.” Metastatic cells can stimulate osteoclast activity through pathways involving PTHrP and RANKL. Osteoclastic resorption releases TGF-β from bone matrix, which in turn can support further tumor activity and osteolysis.</p>
        <p><b>Clinical presentation:</b> New focal bone pain, functional pain, an impending fracture, or an actual pathologic fracture may be the presenting skeletal event. A remote history of breast cancer remains relevant.</p>
        <p><b>Imaging:</b> Skeletal metastases can be destructive and may threaten cortical integrity. Imaging should answer the orthopaedic question: Is this lesion mechanically stable? Is the entire involved bone adequately evaluated? Is there an associated soft-tissue component or fracture?</p>
        <p><b>Radiation response:</b> OKU characterizes breast metastases as relatively radiosensitive. Radiation may therefore provide meaningful pain relief and local tumor control when mechanical stability is adequate.</p>
        <p><b>Biopsy / receptor status:</b> Recurrent breast-cancer metastases may not retain the same receptor profile as the original primary tumor. OKU cites clinically meaningful receptor discordance on repeat biopsy, which is one reason tissue diagnosis can alter systemic treatment.</p>
        <p><b>Orthopaedic implications:</b> Stable lesions may be managed with systemic therapy, antiresorptive therapy, and radiation. Lesions at high risk for fracture still require mechanical stabilization; radiation does not substitute for fixation of an unstable long bone.</p>
        <div class="flow">
          <div><b>Remember:</b> late skeletal recurrence is possible.</div>
          <div><b>Favors nonsurgical care when:</b> mechanically stable and expected to respond to systemic/radiation therapy.</div>
          <div><b>Favors surgery when:</b> impending or completed fracture, major structural compromise, or durable mechanical reconstruction is required.</div>
        </div>
      </section>

      <section class="card">
        <h3>Lung Cancer</h3>
        <p><b>Why it is high yield:</b> Lung carcinoma is a frequent source of skeletal metastatic disease. OKU notes that bone metastases occur more often in non–small cell lung cancer and cites an incidence of approximately 30%–40% in NSCLC.</p>
        <p><b>Major histologic groups:</b> small-cell neuroendocrine carcinoma and non–small cell carcinoma, including adenocarcinoma, squamous cell carcinoma, and large-cell neuroendocrine carcinoma.</p>
        <p><b>Skeletal pattern:</b> Lung-cancer metastases are often osteolytic and can produce rapid cortical destruction, pain, and fracture risk. Distal appendicular metastases are uncommon overall, but OKU specifically notes a predilection for lung carcinoma to metastasize to the hand.</p>
        <p><b>Presentation:</b> Patients may present with new focal pain, difficulty weight bearing, or a pathologic fracture. Occasionally the skeletal lesion is discovered before the primary lung malignancy is known.</p>
        <p><b>Prognostic implication:</b> Histology matters, but prognosis is not perfectly predictable. OKU specifically describes an unusually long-surviving patient with lung-cancer bone metastasis to emphasize that constructs should still be built for durability rather than assuming uniformly short survival.</p>
        <p><b>Orthopaedic implication:</b> For weight-bearing lesions, mechanical risk should drive stabilization decisions. When fixation is undertaken, the goal is durable function with as little disruption of systemic cancer therapy as possible.</p>
        <div class="flow">
          <div><b>High-yield clue:</b> hand/acral metastasis should make lung cancer part of the differential.</div>
          <div><b>Do not undertreat mechanically:</b> even in advanced disease, unstable lesions can cause major morbidity and loss of independence.</div>
        </div>
      </section>

      <section class="card">
        <h3>Multiple Myeloma</h3>
        <p><b>What it is:</b> A systemic plasma-cell malignancy with a strong predilection for bone. It is not a classic solid-tumor metastasis, but in orthopaedic oncology it belongs beside metastatic carcinoma and lymphoma in the differential of an adult lytic lesion.</p>
        <p><b>Who to think about:</b> OKU recommends consistently considering myeloma in patients older than 40 with a lytic lesion of unknown origin.</p>
        <p><b>Bone biology:</b> Myeloma combines increased osteoclastic resorption with suppression of osteoblast-mediated bone formation. This imbalance strongly favors osteolysis and helps explain the lack of a robust reparative/sclerotic response in untreated disease.</p>
        <p><b>Imaging pattern:</b> Lesions are typically geographic and purely lytic, may be central or eccentric, and can cause endosteal scalloping, cortical destruction, fracture, or a soft-tissue component. Skull lesions classically appear “punched out.” Diffuse osteolysis can mimic osteoporosis or a permeative process.</p>
        <p><b>Bone scan limitation:</b> Technetium bone scintigraphy detects osteoblastic activity, which is often absent in myeloma. OKU reports detection of only about 35%–60% of myeloma skeletal lesions, so a negative bone scan does not exclude substantial myeloma bone disease.</p>
        <p><b>Better skeletal imaging:</b> Historically a skeletal survey was used. OKU cites improved sensitivity of whole-body low-dose CT compared with conventional skeletal survey; MRI and PET/CT also have roles in marrow and whole-body assessment.</p>
        <p><b>Clinical features:</b> Bone pain is common. Orthopaedic presentation may also include pathologic fracture or spinal cord compression. Systemic clues include anemia, renal dysfunction, hypercalcemia, infection, bleeding, and hyperviscosity.</p>
        <p><b>Pathology:</b> Marrow is replaced by monoclonal plasma cells. Common diagnostic markers discussed in OKU include CD38, CD56, CD79, and CD138.</p>
        <p><b>Radiation:</b> Myeloma is highly radiosensitive, and radiation is often highly effective for painful lesions or soft-tissue tumor causing cord compression.</p>
        <p><b>Critical mechanical caveat:</b> Tumoricidal response does not necessarily restore cortical strength. Spinal instability and large lytic lesions in weight-bearing bone may still require surgery even when the tumor is expected to respond well to radiation.</p>
        <p><b>Orthopaedic surgery:</b> Major roles are biopsy, stabilization of impending/completed fractures, treatment of structural cord compression, and arthroplasty for destructive periarticular disease. OKU recommends protecting the entire involved long bone when stabilization is required.</p>
        <p><b>Fracture-risk nuance:</b> Mirels was not developed specifically for myeloma, and myeloma lesions may develop a thin sclerotic rim after systemic/antiresorptive therapy. CT-based structural analysis or myeloma-specific approaches may be helpful in difficult cases.</p>
        <div class="red"><b>Red Flag:</b> Hypercalcemia, renal dysfunction, progressive neurologic symptoms, or cord compression can require urgent multidisciplinary treatment.</div>
      </section>

      <section class="card">
        <h3>Renal Cell Carcinoma (RCC)</h3>
        <p><b>Most relevant subtype:</b> RCC accounts for most renal malignancies, and clear-cell RCC is by far the most common histologic variant discussed in OKU.</p>
        <p><b>Skeletal burden:</b> Although the lung is the most common metastatic site, OKU notes that approximately 20%–35% of patients with RCC experience a skeletal-related event, most commonly skeletal metastasis.</p>
        <p><b>Bone biology:</b> RCC skeletal disease is typically osteolytic. RANKL-driven osteoclastogenesis and TGF-β released during bone resorption are prominent components of the metastatic bone microenvironment described in OKU.</p>
        <p><b>Vascularity:</b> RCC metastases may be markedly hypervascular. This matters directly to the surgeon because operative curettage or resection can produce substantial blood loss.</p>
        <p><b>Preoperative embolization:</b> OKU recommends considering embolization for hypervascular renal metastases and notes that embolization can significantly reduce surgical blood loss and morbidity in vascular tumors.</p>
        <p><b>Radiation response:</b> RCC is relatively resistant to conventional external-beam radiation compared with breast cancer. SBRT or other ablative approaches may be useful in selected radioresistant or oligometastatic disease.</p>
        <p><b>Cryoablation:</b> OKU discusses cryoablation as a useful option for selected RCC bone metastases, especially when open surgery carries high morbidity or for smaller/oligometastatic lesions requiring local control.</p>
        <p><b>Reconstruction:</b> Extensive destructive lesions that are not expected to respond adequately to adjuvant treatment may warrant more durable reconstruction. OKU uses metastatic RCC as an example in which segmental resection/endoprosthetic reconstruction may provide more reliable function than limited fixation in selected cases.</p>
        <div class="red"><b>Red Flag — Bleeding Risk:</b> When RCC is suspected or known, explicitly consider lesion vascularity and whether preoperative embolization is appropriate.</div>
      </section>

      <section class="card">
        <h3>Thyroid Carcinoma</h3>
        <p><b>Why it is distinctive:</b> Most thyroid carcinomas are well differentiated. Among differentiated thyroid cancers, OKU identifies follicular carcinoma as the subtype most likely to spread hematogenously.</p>
        <p><b>Common distant sites:</b> Lung and bone are the major sites of metastatic spread discussed in OKU.</p>
        <p><b>Bone biology:</b> Integrins may facilitate adherence of follicular thyroid carcinoma cells to bone. OKU also discusses increased EGFR and VEGF expression and possible involvement of the osteoprotegerin/RANK/RANKL system.</p>
        <p><b>Vascularity:</b> Thyroid metastases, like renal metastases, may be hypervascular. Preoperative embolization can reduce blood loss in selected vascular skeletal lesions.</p>
        <p><b>Clinical pattern:</b> Skeletal disease can present with focal pain, destructive bone loss, impending fracture, or pathologic fracture. Because some differentiated thyroid cancers can have prolonged survival, reconstruction may need to be especially durable.</p>
        <p><b>Surgical implication:</b> In favorable patients with solitary or limited thyroid metastasis and substantial bone destruction, a more definitive reconstruction may be appropriate when expected survival is long enough to justify it.</p>
        <div class="flow">
          <div><b>Think thyroid when:</b> an adult has a vascular destructive bone lesion, particularly if pathology or clinical history suggests follicular thyroid carcinoma.</div>
          <div><b>Plan ahead:</b> bleeding risk and long expected survival can both influence the operative strategy.</div>
        </div>
      </section>

      <section class="card">
        <h3>Lymphoma Involving Bone</h3>
        <p><b>Two clinical settings:</b> Bone may be involved secondarily as part of systemic lymphoma or may represent primary lymphoma of bone.</p>
        <p><b>Primary bone lymphoma:</b> OKU defines this as lymphoma involving a single bone, with or without one regional lymph node, without additional sites of disease for 6 months after diagnosis. Most primary bone lymphomas are diffuse large B-cell lymphoma.</p>
        <p><b>Typical locations:</b> The axial skeleton is common, and long-bone disease frequently involves metaphyseal regions of the femur, humerus, and tibia—areas associated with active hematopoietic marrow.</p>
        <p><b>Symptoms:</b> Activity-related pain, rest pain, and night pain are common. Pain may transiently improve with NSAIDs or corticosteroids. Constitutional symptoms—night sweats, fever, weight loss, or prolonged lymphadenopathy—raise concern for systemic lymphoma, although patients with isolated primary bone lymphoma may lack these symptoms.</p>
        <p><b>Radiographs:</b> Early radiographs can be normal. With progression, an ill-defined permeative lytic pattern may develop, with cortical weakening and pathologic fracture. Less commonly the process may be mixed or sclerotic.</p>
        <p><b>MRI:</b> Because lymphoma is a marrow-infiltrating disease, MRI may show abnormal marrow before radiographs become clearly destructive. This is why lymphoma can be discovered incidentally on MRI obtained for an apparently unrelated musculoskeletal complaint.</p>
        <p><b>Pathology:</b> Diagnosis relies on biopsy plus immunohistochemistry/flow cytometry and, when needed, molecular studies. CD20 is an important B-cell marker discussed in OKU for distinguishing many lymphomas from other small-round-blue-cell tumors.</p>
        <p><b>Systemic response:</b> Lymphoma can respond rapidly and dramatically to chemotherapy and steroids, often with substantial subsequent bone regeneration. This is a major difference from many epithelial metastases.</p>
        <p><b>Orthopaedic role:</b> Surgery is primarily for diagnosis and for impending or actual pathologic fracture. Mechanically stable flat-bone lesions may often be managed with activity modification, assistive devices, systemic treatment, and/or radiation.</p>
        <p><b>Long-bone stabilization:</b> If surgery is needed, address the entire involved bone and aim for immediate function/weight bearing. Proximal femoral destruction may require prosthetic reconstruction, whereas shaft lesions can often be treated with intramedullary devices.</p>
        <p><b>Prognosis:</b> Early-stage primary bone lymphoma can have excellent long-term survival; OKU cites up to approximately 90% 5-year survival when chemotherapy can be administered. That long survival should influence implant durability and reconstruction choices.</p>
        <div class="pearl"><b>Clinical Pearl:</b> Because lymphoma may regenerate bone rapidly after chemotherapy, avoid assuming every dramatic-looking lytic lesion requires immediate extensive reconstruction. The decision depends on actual fracture risk and functional consequences.</div>
      </section>

      <section class="card">
        <h3>Quick Comparison</h3>
        <div class="flow">
          <div><b>Breast:</b> can relapse late; relatively radiosensitive; tissue receptor status may change.</div>
          <div><b>Lung:</b> commonly lytic; NSCLC frequently involves bone; hand metastasis is a classic clue.</div>
          <div><b>Myeloma:</b> purely lytic marrow disease; bone scan may underestimate disease; highly radiosensitive but structural defects may still need fixation.</div>
          <div><b>RCC:</b> lytic + hypervascular + relatively radioresistant; consider embolization and durable reconstruction.</div>
          <div><b>Thyroid:</b> follicular subtype spreads hematogenously; bone lesions may be vascular; longer survival can favor durable surgery.</div>
          <div><b>Lymphoma:</b> marrow infiltrative and often treatment-responsive; radiographs may initially be normal; rapid bone recovery after chemotherapy may alter surgical timing.</div>
        </div>
      </section>

      <section class="card red">
        <h3>Do Not Skip the Biopsy Question</h3>
        <p>Even in a patient with an established primary malignancy, a first skeletal lesion may represent a second malignancy, a primary bone tumor, or a lesion whose biologic profile differs from the original cancer. If the diagnosis is not secure, establish tissue before committing to definitive treatment.</p>
      </section>`;
  }else if(current==="Mechanical Risk / Mirels"){
    body=`
      <section class="card">
        <h3>Traditional Mirels Calculator</h3>
        <p>Mirels is a four-part long-bone fracture-risk score using site, pain, lesion type, and lesion size. Use it as one input—not as a stand-alone decision rule.</p>
        <div class="mirels-grid">
          <div class="mirels-field"><label>Site</label><select class="mirels-select"><option value="1">Upper extremity — 1</option><option value="2">Lower extremity — 2</option><option value="3">Peritrochanteric — 3</option></select></div>
          <div class="mirels-field"><label>Pain</label><select class="mirels-select"><option value="1">Mild — 1</option><option value="2">Moderate — 2</option><option value="3">Functional pain — 3</option></select></div>
          <div class="mirels-field"><label>Lesion</label><select class="mirels-select"><option value="1">Blastic — 1</option><option value="2">Mixed — 2</option><option value="3">Lytic — 3</option></select></div>
          <div class="mirels-field"><label>Size vs bone diameter</label><select class="mirels-select"><option value="1">&lt; 1/3 — 1</option><option value="2">1/3 to 2/3 — 2</option><option value="3">&gt; 2/3 — 3</option></select></div>
        </div>

        <p class="mini-note">Traditional interpretation: ≤7 lower risk; 8 clinical judgment; ≥9 commonly used threshold to consider prophylactic fixation.</p>
      </section>
      <section class="card red"><h3>Mirels Limitation</h3><p>The OKU text specifically cautions that Mirels is subjective, lacks reproducibility, may overestimate fracture risk, and predates modern bisphosphonates, chemotherapy, and targeted therapy.</p></section>
      <section class="card pearl"><h3>What Else Changes the Decision?</h3><p>Functional pain, cortical destruction, actual mechanical instability, tumor biology and expected treatment response, patient performance status, prognosis, surgical morbidity, and the consequence of delaying systemic therapy.</p></section>
      <section class="card"><h3>Why Prophylactic Fixation Matters</h3><p>Completed pathologic fracture increases morbidity and loss of independence. Prophylactic surgery can reduce complications, hospital stay, and cost compared with treating a completed pathologic fracture.</p></section>
      <section class="card"><h3>Beyond Mirels</h3><p>CT-based structural rigidity analysis and finite-element techniques have shown improved fracture prediction in selected femoral metastatic lesions, but availability and clinical implementation vary.</p></section>`;
  }else if(current==="Pathologic Fracture"){
    body=`
      <section class="card red"><h3>Pathologic Fracture = Oncologic Event</h3><p>A pathologic fracture is not managed like a routine traumatic fracture. Before definitive fixation, confirm the diagnosis and understand the patient's overall disease, prognosis, and treatment plan.</p></section>
      <section class="card"><h3>Immediate Questions</h3><div class="flow"><div>Is this a known metastatic diagnosis or an uncharacterized lesion?</div><div>Is the fracture stable or unstable? How much structural bone has been lost?</div><div>What is the patient's performance status and expected prognosis?</div><div>What systemic or radiation treatment is planned, and how quickly must it resume?</div><div>What reconstruction is durable enough to last for the patient's expected lifespan?</div></div></section>
      <section class="card"><h3>Goals of Surgery</h3><p>Provide durable stability, reduce pain, preserve or restore activity and independence, and when possible permit immediate weight bearing. Because metastatic lesions often do not heal by normal bony consolidation, constructs frequently rely on durable fixation, cement augmentation, or endoprosthetic reconstruction.</p></section>
      <section class="card pearl"><h3>Clinical Pearl</h3><p>For metastatic disease, a more durable reconstruction can be preferable to the least invasive operation if it reduces the risk of mechanical failure and revision during the patient's remaining lifespan.</p></section>
      <section class="card"><h3>When Nonsurgical Care May Fit</h3><p>Stable fractures with limited bone loss, poor performance status, short expected survival, or lesions responsive to radiation/systemic therapy may sometimes be managed with immobilization, radiation, analgesia, and multidisciplinary supportive care.</p></section>
      <section class="card"><h3>NP / Clinic Checklist</h3><p>Document pain and function, weight-bearing status, neurovascular exam, current cancer therapy, anticoagulation, labs/medical optimization issues, imaging, pathology status, surgical plan, postoperative weight-bearing, radiation timing, wound checks, DVT prophylaxis plan, and rehabilitation needs.</p></section>`;
  }else if(current==="Upper Extremity"){
    body=`
      <section class="card">
        <h3>Why the Upper Extremity Matters</h3>
        <p>Upper-extremity metastases can substantially impair bathing, toileting, eating, transfers, and use of assistive devices. The humerus accounts for more than half of upper-extremity skeletal metastases.</p>
      </section>
      <section class="card pearl"><h3>Clinical Pearl</h3><p>Think function, not just “non–weight bearing.” A patient with lower-extremity disease may depend on the arms for a walker or crutches, making durable upper-extremity function especially important.</p></section>
      <section class="card">
        <h3>Initial Algorithm</h3>
        <div class="flow">
          <div>Confirm metastatic cancer or obtain staging/biopsy if the diagnosis is not established.</div>
          <div>Determine whether there is a fracture or impending fracture.</div>
          <div>Stable fracture + minimal bone loss, poor performance status, or short expected survival → immobilization and radiation may be appropriate.</div>
          <div>Unstable fracture / major structural loss + acceptable performance status → consider surgery for durable stability and pain relief.</div>
        </div>
      </section>
      <section class="card">
        <h3>Proximal Humerus</h3>
        <p><b>&lt;50% bone stock loss with preserved articular surface:</b> curettage and PMMA, with fixation as needed for structural stability.</p>
        <p><b>&gt;50% bone stock loss and/or loss of the articular surface:</b> endoprosthetic reconstruction becomes more appropriate. Cemented hemiarthroplasty may be used when the tuberosities are intact; larger segmental loss may require proximal humeral replacement. Reverse shoulder arthroplasty can be considered in selected patients with deficient cuff attachments.</p>
      </section>
      <section class="card">
        <h3>Humeral Diaphysis</h3>
        <p>Without segmental bone loss, plating or antegrade intramedullary nailing are accepted approaches. For radiosensitive disease, long intramedullary fixation plus postoperative radiation may provide durable palliation. Less radiosensitive or more destructive lesions may require curettage, plate fixation, and PMMA augmentation.</p>
      </section>
      <section class="card">
        <h3>Distal Humerus</h3>
        <p>The supracondylar region is a natural stress riser and tolerates metastatic bone loss poorly. Fractures or impending fractures may require orthogonal plating with PMMA augmentation; major bone loss may require distal humeral endoprosthetic reconstruction.</p>
      </section>

        <h3>Forearm, Wrist & Hand</h3>
        <p>Radius and ulna lesions near major articular ends are treated with attention to joint congruity and stability, often using PMMA with or without fixation. Selected proximal radius or distal ulna lesions may be resected. Hand metastases are rare; small destructive lesions may be treated with curettage/PMMA, whereas extensive digital bone and soft-tissue destruction can require ablative surgery.</p>

  }else if(current==="Lower Extremity"){
    body=`
      <section class="card">
        <h3>Core Goal</h3>
        <p>Lower-extremity metastatic disease threatens ambulation and independence. Treatment aims to relieve pain, preserve mobility, and prevent or treat pathologic fracture with a construct that permits durable weight bearing.</p>
      </section>
      <section class="card pearl"><h3>Clinical Pearl</h3><p>The femur is the long bone most commonly affected by metastatic disease, and prophylactic fixation generally produces better pain and functional outcomes than waiting for a completed fracture.</p></section>
      <section class="card">
        <h3>Femoral Head & Neck</h3>
        <p>Arthroplasty is the mainstay because fixation without resection is prone to failure. Cemented hemiarthroplasty is favored when there is no clinically important acetabular disease, with stem selection tailored to diseased bone and more distal femoral involvement.</p>
      </section>
      <section class="card red"><h3>Whole-Femur Check</h3><p>Before choosing a stem or fixation length, assess the entire femur for additional metastatic disease. A short implant may fail to protect a more distal weakened segment.</p></section>
      <section class="card">
        <h3>Intertrochanteric / Subtrochanteric</h3>
        <p>Management depends on remaining bone stock. Significant bone loss, femoral head/neck disease, or fracture may favor endoprosthetic reconstruction. If adequate calcar and bone stock remain, a long intramedullary nail can provide stabilization while protecting the femur, with PMMA augmentation when needed.</p>
      </section>
      <section class="card">
        <h3>Femoral Shaft</h3>
        <p>Large or mechanically compromising shaft lesions are commonly treated with a large-diameter intramedullary nail, with or without curettage and cement augmentation. Modern constructs can extend fixation into the femoral neck/head to protect the proximal femur.</p>
      </section>
      <section class="card">
        <h3>Distal Femur</h3>
        <p>Metaphyseal/supracondylar defects may be managed with curettage, PMMA, and plate fixation when structural stability can be maintained. Larger periarticular destruction may require arthroplasty rather than fixation.</p>
      </section>
      <section class="card">
        <h3>Tibia, Ankle & Foot</h3>
        <p>Distal tibia/fibula and foot metastases are uncommon. Small nonstructural lesions may respond to radiation; structural compromise may require curettage, cementation, and internal fixation. Refractory destructive lesions in small bones can occasionally require amputation.</p>
      </section>
      <section class="card">

        <p>Stable fixation with immediate weight bearing whenever feasible is a recurring theme in OKU. Complex periarticular reconstruction should be reserved for substantial bone loss and patients likely to live long enough to benefit from the added durability.</p>
      </section>
      <section class="card"><h3>NP / Clinic Focus</h3><p>Document functional pain, gait, assistive device use, weight-bearing status, hip/knee/ankle motion, distal neurovascular exam, postoperative mobility plan, rehabilitation, radiation timing, systemic therapy timing, DVT prophylaxis, and wound complications.</p></section>`;
  }else if(current==="Pelvis & Acetabulum"){
    body=`
      <section class="card">
        <h3>Pelvis: Structural vs Nonstructural Disease</h3>
        <p>Nonacetabular lesions of the iliac wing, ischium, or pubic rami often fall outside the main weight-bearing axis and can frequently be treated nonsurgically. Periacetabular disease is more mechanically consequential and can threaten ambulation.</p>
      </section>
      <section class="card">
        <h3>Nonacetabular Lesions</h3>
        <p>Options may include radiation, radiofrequency ablation, embolization, systemic therapy, and analgesic strategies. Surgery can be considered for refractory disease, but bony reconstruction is often unnecessary if the pelvic columns and weight-bearing axis remain intact.</p>
      </section>
      <section class="card pearl"><h3>Clinical Pearl</h3><p>For periacetabular disease, pain control and preservation of ambulatory status are the central goals. Osteosynthesis alone may be inadequate because metastatic bone often does not reliably heal.</p></section>
      <section class="card">
        <h3>Periacetabular Workup</h3>
        <p>Cross-sectional imaging is important because plain/Judet views may underestimate bone loss. Define the lesion's relationship to the medial wall, superior dome, lateral cortex, posterior column, and inferior acetabulum before choosing reconstruction.</p>
      </section>
      <section class="card">
        <h3>Modified Harrington Framework</h3>
        <div class="flow">
          <div><b>Type 0:</b> nonarticular / nonacetabular lesion without subchondral penetration.</div>
          <div><b>Type I:</b> contained acetabular lesion; lateral cortex, superior dome, and medial wall remain intact.</div>
          <div><b>Type II:</b> medial-wall defect.</div>
          <div><b>Type III:</b> loss of superior bone plus lateral cortex.</div>
          <div><b>Type IV:</b> additional inferior bone loss with pelvic discontinuity.</div>
          <div><b>Type V:</b> major defect after resection of substantial nonviable bone.</div>
        </div>

        <p><b>Type III:</b> rebuild the acetabular defect with cement, screws or Steinmann pins, and a protrusio cup or cup-cage construct.</p>
        <p><b>Type IV:</b> treat similarly to type III but address pelvic discontinuity and inferior support.</p>
        <p><b>Type V:</b> highly individualized; complex reconstructions or custom implants may be considered in selected patients with longer expected survival.</p>

      <section class="card">

      </section>

  }else if(current==="Radiation & Systemic Therapy"){
    body=`
      <section class="card">
        <h3>Multidisciplinary Principle</h3>
        <p>Systemic treatment is central to metastatic cancer care, and orthopaedic interventions should be coordinated to minimize unnecessary interruption of therapy. The timing of surgery, chemotherapy, immunotherapy, hormonal therapy, targeted agents, and radiation should be discussed with the oncology team.</p>
      </section>
      <section class="card red">
        <h3>Perioperative Medication Red Flag</h3>
        <p>OKU specifically highlights VEGF-pathway and multikinase inhibitors such as bevacizumab, pazopanib, sorafenib, and cabozantinib because of their potential to impair wound healing. Do not independently stop or restart these agents—coordinate perioperative timing with medical oncology.</p>
      </section>
      <section class="card">
        <h3>External Beam Radiation Therapy</h3>
        <p>External beam radiation therapy is a mainstay of treatment for bone metastases. It can reduce pain and may promote consolidation in selected lesions. Response varies by histology: breast metastases are generally more radiosensitive, whereas renal cell carcinoma is comparatively radioresistant.</p>
      </section>
      <section class="card">
        <h3>Palliative vs Ablative Intent</h3>
        <div class="flow">
          <div><b>Palliative radiation:</b> primarily intended for pain relief; OKU describes typical total doses in the 8–30 Gy range using variable fractionation.</div>
          <div><b>Ablative radiation:</b> uses higher doses and may be considered for selected oligometastatic or relatively radioresistant disease.</div>
          <div><b>Stereotactic body radiation therapy:</b> may be particularly useful for oligometastatic disease and tumors that are less responsive to conventional radiation.</div>
        </div>
      </section>
      <section class="card pearl">
        <h3>Clinical Pearl — Radiation Timing</h3>
        <p>There is no single standardized sequence of surgery and radiation. A completed fracture generally takes surgical priority, whereas an impending fracture requires individualized assessment of mechanical risk and expected tumor response to radiation.</p>
      </section>
      <section class="card">
        <h3>Radiation & Wound Considerations</h3>
        <p>Preoperative radiation can increase wound-complication and revision risk. OKU also notes that higher ablative radiation doses carry more local toxicity and may increase wound complications if surgery is later required.</p>
      </section>
      <section class="card">
        <h3>Antiresorptive Therapy</h3>
        <p>Bone-directed antiresorptive therapy should be considered in many patients with metastatic bone disease to help preserve bone stock and reduce skeletal-related events. OKU discusses bisphosphonates and denosumab; denosumab is described as reducing skeletal-related events compared with zoledronic acid in the cited evidence.</p>
      </section>
      <section class="card">
        <h3>Other Nonsurgical Options</h3>
        <p>Depending on the lesion and patient, management may also include chemotherapy, immunotherapy, minimally invasive ablation, cryoablation, cementoplasty/acetabuloplasty, analgesic treatment, and protected weight bearing.</p>
      </section>
      <section class="card">
        <h3>NP Coordination Checklist</h3>

      </section>`;
  }else{
    body=`
      <section class="card">
        <h3>Postoperative Priorities</h3>
        <div class="flow">
          <div>Confirm the intended postoperative weight-bearing and activity plan.</div>
          <div>Assess whether pain and function are improving as expected.</div>
          <div>Monitor wound healing closely, particularly when systemic therapy or radiation may affect recovery.</div>
          <div>Coordinate rehabilitation and assistive-device needs early.</div>
          <div>Minimize unnecessary delay in restarting systemic or radiation therapy.</div>
        </div>
      </section>
      <section class="card pearl">
        <h3>Clinical Pearl</h3>
        <p>The goal is not simply radiographic fixation. Metastatic reconstruction is intended to restore function, reduce pain, preserve independence, and allow the patient to return to the rest of their cancer treatment with as little interruption as possible.</p>
      </section>
      <section class="card">
        <h3>Weight Bearing & Mobility</h3>
        <p>OKU repeatedly emphasizes stable constructs that allow immediate weight bearing when feasible, especially in lower-extremity disease. Early coordination with physical therapy supports restoration of ambulation and quality of life.</p>
      </section>
      <section class="card">
        <h3>Wound & Incision Assessment</h3>
        <p>Assess drainage, erythema, dehiscence, swelling, and delayed healing. Wound vigilance is particularly important in patients receiving chemotherapy, targeted agents that impair angiogenesis, or perioperative radiation.</p>
      </section>
      <section class="card">
        <h3>Pain & Functional Response</h3>
        <p>Track pain at rest and with function, ability to transfer or ambulate, use of assistive devices, and return of upper-extremity activities of daily living when applicable. Persistent or worsening mechanical pain should prompt reassessment of the construct and disease progression.</p>
      </section>
      <section class="card">
        <h3>Oncology Treatment Handoff</h3>
        <p>Confirm when medical oncology and radiation oncology plan to resume treatment. Because systemic therapy is the central treatment for metastatic cancer, postoperative care should support the shortest safe interruption of cancer-directed therapy.</p>
      </section>
      <section class="card">
        <h3>Surveillance for Skeletal-Related Events</h3>
        <p>Continue monitoring for new pathologic fracture, spinal cord compression symptoms, pain requiring radiation, or the need for additional skeletal surgery. These events are major drivers of morbidity in metastatic bone disease.</p>
      </section>
      <section class="card red">
        <h3>Escalate Promptly</h3>
        <p>New inability to bear weight, sudden increase in mechanical pain, new deformity, progressive neurologic symptoms, concerning wound changes, or loss of previously gained function should trigger urgent reassessment.</p>

        <p><b>Symptoms:</b> pain, new neurologic symptoms, constitutional change.<br><b>Function:</b> ambulation, transfers, ADLs, assistive device use.<br><b>Exam:</b> incision, swelling, joint motion, motor/sensory status, limb perfusion.<br><b>Plan:</b> weight bearing, therapy, interval imaging, radiation timing, systemic-therapy timing, and the next multidisciplinary oncology follow-up.</p>
      </section>`;
  }
  view.innerHTML=`<section class="page"><p class="eyebrow">Orthopaedic Oncology</p><h1>Metastatic Bone Disease</h1><p class="lead">Mechanical risk · site-specific reconstruction · pathologic fracture management</p><div class="tabs">${metastaticTabs.map(t=>`<button class="tab ${t===current?"active":""}" data-met-tab="${t}">${t}</button>`).join("")}</div>${body}<section class="card"><h3>Primary Reference</h3><p>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed. — Section 5: Metastatic Disease to Bone, especially Chapters 31–33.</p></section></section>`;
  if(current==="Mechanical Risk / Mirels")updateMirels();

function updateMirels(){
  const sels=[...document.querySelectorAll(".mirels-select")];
  if(!sels.length)return;
  const score=sels.reduce((n,s)=>n+Number(s.value),0);
  const scoreEl=$("#mirelsScore"), label=$("#mirelsLabel"), text=$("#mirelsText");
  if(scoreEl)scoreEl.textContent=score;
  if(score<=7){
    label.textContent="Traditional lower-risk range";
    text.textContent="Scores ≤7 are traditionally observed/treated nonsurgically when otherwise appropriate. Clinical context remains essential.";
  }else if(score===8){
    label.textContent="Clinical-judgment range";
    text.textContent="A score of 8 is traditionally considered borderline. Review mechanical symptoms, cortical destruction, prognosis, tumor biology, and treatment response.";
  }else{
    label.textContent="Consider prophylactic fixation";
    text.textContent="Scores ≥9 are traditionally used as a threshold to consider prophylactic stabilization, but the decision should not be based on Mirels alone.";
  }
}


const tumorFilterState={behavior:"All",tissue:"All Tissues",q:""};

function filteredTumors(){
  let list=entries.filter(x=>x.group==="tumors");
  if(tumorFilterState.behavior!=="All"){
    list=list.filter(x=>x.behavior===tumorFilterState.behavior);
  }
  if(tumorFilterState.tissue!=="All Tissues"){
    list=list.filter(x=>x.tissue===tumorFilterState.tissue);
  }
  if(tumorFilterState.q){
    const z=tumorFilterState.q.toLowerCase();
    list=list.filter(x=>(`${x.title} ${x.behavior} ${x.tissue} ${x.lineage} ${x.sub}`).toLowerCase().includes(z));
  }
  return list;
}

function refreshTumorLibrary(){
  const list=filteredTumors();
  const listEl=$("#tumorList");
  if(listEl){
    listEl.innerHTML=list.length?list.map(row).join(""):`<div class="empty">No tumors match these filters.</div>`;
  }
  const countEl=$("#tumorCount");
  if(countEl)countEl.textContent=`${list.length} ${list.length===1?"entry":"entries"}`;
  document.querySelectorAll("[data-behavior]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.behavior===tumorFilterState.behavior);
  });
  document.querySelectorAll("[data-tissue]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.tissue===tumorFilterState.tissue);
  });
}

function tumorLibrary(behavior="All",tissue="All Tissues",q=""){
  setTop("Tumor Library");activeNav("");
  tumorFilterState.behavior=behavior;
  tumorFilterState.tissue=tissue;
  tumorFilterState.q=q;
  const list=filteredTumors();
  view.innerHTML=`<section class="page">
    <p class="eyebrow">Bone & Soft Tissue</p>
    <h1>Tumor Library</h1>
    <p class="lead">One unified library with biologic behavior and tissue filters.</p>
    <div class="searchbox"><input id="tumorSearch" placeholder="Search tumors…" value="${q}"></div>
    <div class="filterbar">
      ${["All","Benign","Intermediate","Malignant","Tumor-like"].map(x=>`<button type="button" class="chip ${x===behavior?"active":""}" data-behavior="${x}">${x}</button>`).join("")}
    </div>
    <div class="filterbar">
      ${["All Tissues","Bone","Soft Tissue"].map(x=>`<button type="button" class="chip ${x===tissue?"active":""}" data-tissue="${x}">${x}</button>`).join("")}
    </div>
    <p id="tumorCount" class="mini-note">${list.length} ${list.length===1?"entry":"entries"}</p>
    <div id="tumorList" class="list">${list.length?list.map(row).join(""):`<div class="empty">No tumors match these filters.</div>`}</div>
  </section>`;
}
function detailPage(id,tab){
  const e=entries.find(x=>x.id===id), d=content[id]; if(!e)return home();
  setTop(e.title,true,id);activeNav("");
  if(!d){view.innerHTML=`<section class="page"><p class="eyebrow">Tumor Library</p><h1>${e.title}</h1><div class="badges"><span class="badge ${e.behavior.toLowerCase().replace(/[^a-z]/g,"")}">${e.behavior}</span><span class="badge">${e.tissue}</span><span class="badge">${e.lineage}</span></div><p class="lead">${e.sub}</p><div class="empty">This diagnosis is intentionally not populated yet. Osteochondroma is being used to approve the final tumor-page template before the rest of the library is expanded.</div></section>`;return}
  const tabs=Object.keys(d.tabs), current=tab&&tabs.includes(tab)?tab:tabs[0];
  const cards=d.tabs[current].map(c=>`<section class="card ${c[2]||""}"><h3>${c[0]}</h3><p>${c[1]}</p></section>`).join("");
  view.innerHTML=`<section class="page"><p class="eyebrow">Tumor Library</p><h1>${e.title}</h1><div class="badges">${d.badges.map(b=>`<span class="badge">${b}</span>`).join("")}</div><p class="lead">${e.sub}</p><div class="tabs">${tabs.map(t=>`<button class="tab ${t===current?"active":""}" data-tab="${t}" data-id="${id}">${t}</button>`).join("")}</div>${cards}</section>`
}
function searchPage(q=""){
  setTop("Search");activeNav("search");
  const term=q.toLowerCase(), r=entries.filter(e=>!term||(`${e.title} ${e.sub}`).toLowerCase().includes(term));
  view.innerHTML=`<section class="page"><p class="eyebrow">Universal search</p><h1>Search</h1><div class="searchbox"><input id="searchInput" value="${q}" placeholder="Search OrthoPearls…"></div><div id="results" class="list">${r.length?r.map(row).join(""):`<div class="empty">No matches.</div>`}</div></section>`
}
function favoritesPage(){
  setTop("Favorites");activeNav("favorites");
  const r=entries.filter(e=>isFav(e.id));
  view.innerHTML=`<section class="page"><p class="eyebrow">Saved reference</p><h1>Favorites</h1><p class="lead">Tap ☆ on a detail page to save it here.</p><div class="list">${r.length?r.map(row).join(""):`<div class="empty">No favorites yet.</div>`}</div></section>`
}
function settingsPage(){
  setTop("Settings");activeNav("settings");
  view.innerHTML=`<section class="page"><p class="eyebrow">App</p><h1>Settings</h1><section class="card"><h3>Clean build</h3><p>No service worker, no offline caching, and no external JS/CSS yet. This is intentional so we can verify the app shell and navigation first.</p></section></section>`
}
function render(){
  const h=location.hash.slice(1)||"home";
  if(h==="home")return home();
  if(h==="search")return searchPage();
  if(h==="favorites")return favoritesPage();
  if(h==="settings")return settingsPage();
  if(sections.some(s=>s[0]===h))return sectionPage(h);
  if(h.startsWith("detail/"))return detailPage(h.split("/")[1]);
  home()
}
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-route]");if(r){go(r.dataset.route);return}
  const d=e.target.closest("[data-detail]");if(d){go("detail/"+d.dataset.detail);return}
  const t=e.target.closest("[data-tab]");if(t){detailPage(t.dataset.id,t.dataset.tab);return}
  const mt=e.target.closest("[data-met-tab]");if(mt){metastaticPage(mt.dataset.metTab);return}
  const b=e.target.closest("[data-behavior]");if(b){
    tumorFilterState.behavior=b.dataset.behavior;
    refreshTumorLibrary();
    return;
  }
  const ti=e.target.closest("[data-tissue]");if(ti){
    tumorFilterState.tissue=ti.dataset.tissue;
    refreshTumorLibrary();
    return;
  }
});
document.addEventListener("change",e=>{if(e.target.matches(".mirels-select"))updateMirels()});
document.addEventListener("input",e=>{
  if(e.target.id==="searchInput"){
    const q=e.target.value.toLowerCase();
    const r=entries.filter(x=>!q||(`${x.title} ${x.sub}`).toLowerCase().includes(q));
    $("#results").innerHTML=r.length?r.map(row).join(""):`<div class="empty">No matches.</div>`;
  }
  if(e.target.id==="tumorSearch"){
    tumorFilterState.q=e.target.value;
    refreshTumorLibrary();
  }
});
$("#backBtn").addEventListener("click",()=>history.length>1?history.back():go("home"));
favBtn.addEventListener("click",()=>{if(favBtn.dataset.id)toggleFav(favBtn.dataset.id)});
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>

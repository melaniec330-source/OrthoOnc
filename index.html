<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082f52">
<title>OrthoPearls</title>
<style>
:root{
  --navy:#082f52;--navy2:#0c466f;--bg:#f4f7fa;--card:#fff;--ink:#14283a;
  --muted:#6e7e8c;--line:#dce5ec;--soft:#edf3f7;--danger:#b42318;--dangerbg:#fff2f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}
main{padding-bottom:76px}
.hidden{display:none!important}
.hero{
  color:#fff;padding:calc(34px + env(safe-area-inset-top)) 20px 24px;
  min-height:290px;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#041f37,#073d67 68%,#0d4f80)
}
.hero:after{
  content:"";position:absolute;right:-35px;top:20px;width:230px;height:270px;opacity:.13;
  background:
    radial-gradient(ellipse at 45% 20%,transparent 0 17%,#e3f0fa 18% 20%,transparent 21% 32%,#e3f0fa 33% 35%,transparent 36%),
    linear-gradient(90deg,transparent 47%,#e3f0fa 48% 52%,transparent 53%);
  transform:rotate(-10deg)
}
.hero-content{position:relative;z-index:1}
.hero h1{margin:0;font:500 3rem/1 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
.hero .sub{margin:.45rem 0 0;font-size:1rem}
.hero .tag{margin:.25rem 0 0;color:#dbe9f3;font-size:.84rem}
.search-launch{
  position:relative;z-index:1;margin-top:38px;width:100%;border:1px solid rgba(255,255,255,.36);
  background:rgba(255,255,255,.13);color:white;border-radius:14px;padding:12px 14px;text-align:left
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.tile{
  min-height:132px;border:1px solid var(--line);background:var(--card);border-radius:15px;
  color:var(--ink);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center
}
.tile .glyph{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--navy2);font-weight:800;margin-bottom:8px}
.tile b{font-size:.95rem}.tile small{display:block;color:var(--muted);font-size:.7rem;margin-top:5px;line-height:1.3}
.footer-note{text-align:center;color:var(--muted);font:italic .84rem Georgia,serif;margin:4px 0 24px}
.topbar{
  position:sticky;top:0;z-index:20;height:calc(58px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);background:var(--navy);color:white;
  display:grid;grid-template-columns:48px 1fr 48px;align-items:center
}
.topbar button{border:0;background:none;color:white;font-size:1.7rem}
.topbar h2{margin:0;text-align:center;font:700 1.08rem Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{padding:18px 14px 28px}
.eyebrow{margin:0 0 5px;text-transform:uppercase;letter-spacing:.11em;color:var(--navy2);font-weight:800;font-size:.66rem}
.page h1{margin:0;font:700 1.76rem Georgia,serif}
.lead{color:var(--muted);font-size:.87rem;line-height:1.5;margin:7px 0 16px}
.list{display:grid;gap:9px}
.row{
  width:100%;display:grid;grid-template-columns:46px 1fr 18px;gap:10px;align-items:center;
  border:1px solid var(--line);background:var(--card);border-radius:14px;color:var(--ink);padding:10px;text-align:left
}
.thumb{width:46px;height:46px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--navy2);font-weight:800}
.row b{display:block}.row small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}.chev{font-size:1.45rem;color:var(--navy2)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:12px -14px 14px;padding:0 14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);padding:9px;border-bottom:2px solid transparent;white-space:nowrap;font-size:.76rem}
.tab.active{color:var(--navy2);border-bottom-color:var(--navy2);font-weight:800}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:1rem}.card p,.card li{color:var(--muted);font-size:.86rem;line-height:1.5}.card ul{padding-left:20px;margin:0}
.pearl{padding-left:52px;position:relative;background:linear-gradient(135deg,var(--card),#f3f7f9)}
.pearl:before{
  content:"";position:absolute;left:15px;top:15px;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 20%,#f7f0e6 42%,#d5c4b3 78%,#9c8f82 100%);
  box-shadow:0 2px 5px #0002
}
.red{background:var(--dangerbg);border-color:#f0c9c4}.red h3{color:var(--danger)}
.searchbox{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;margin:12px 0}
.searchbox input{width:100%;border:0;outline:0;background:none;color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);background:var(--card);border-radius:14px}
.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:30;width:min(760px,100%);
  height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line)
}
.bottom button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bottom button.active{color:var(--navy2);font-weight:800}.bottom small{font-size:.62rem}
.filterbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:.72rem}.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.badge{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:var(--soft);color:var(--navy2)}.badge.intermediate{background:#fff4d7;color:#805b00}.badge.malignant{background:#fff0ef;color:#9f1c13}.badge.tumorlike{background:#f2efff;color:#5e45a4}
.siggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sig{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fafcfd}.sig b{display:block;font-size:.68rem;color:var(--ink);margin-bottom:3px}.sig span{font-size:.76rem;color:var(--muted)}
.ref{font-size:.78rem;color:var(--muted);line-height:1.5}.imaging-figure{margin:0}.imaging-figure img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#0b1117}.imaging-figure figcaption{margin-top:8px;font-size:.72rem;line-height:1.45;color:var(--muted)}.source-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.source-actions a{display:inline-block;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;color:var(--navy2);font-size:.76rem;font-weight:700}.crosslinks{display:flex;flex-wrap:wrap;gap:8px}.crosslinks button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--navy2);font-size:.76rem}
.mirels-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mirels-field{border:1px solid var(--line);background:#fafcfd;border-radius:11px;padding:10px}.mirels-field label{display:block;font-size:.7rem;font-weight:800;color:var(--ink);margin-bottom:6px}.mirels-field select{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px;font-size:.76rem}.scorebox{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--soft)}.scorebox strong{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--navy);color:#fff;font-size:1.55rem}.scorebox b{display:block;margin-bottom:4px}.scorebox span{font-size:.76rem;color:var(--muted);line-height:1.4}.flow{display:grid;gap:7px}.flow div{border-left:3px solid var(--navy2);background:#fafcfd;padding:9px 11px;border-radius:0 10px 10px 0;color:var(--muted);font-size:.8rem;line-height:1.4}.mini-note{font-size:.72rem!important}.met-menu{display:grid;gap:8px;margin-top:12px}.met-menu button{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;color:var(--ink)}.met-menu button span{color:var(--navy2);font-size:1.2rem}
@media(max-width:390px){.hero h1{font-size:2.65rem}.grid{padding:11px}.tile{min-height:122px}}
</style>
</head>
<body>

</div>

      ["Clinical Pearl","The zonal pattern is the key clue: mature mineralization develops at the periphery of the lesion, unlike osteosarcoma where tumor bone is more often central.","pearl"],

  tabs:{
    "Overview":[
      ["At a Glance","Bone infarct, also called osteonecrosis, results from ischemic death of bone and marrow cells. In the metadiaphysis, it can mimic cartilaginous or lytic bone tumors."],
      ["Associated Conditions","OKU lists associations including sickle cell anemia, chronic steroid use, alcohol abuse, Gaucher disease, dysbarism, lupus, and renal transplantation."],
      ["Clinical Pearl","A serpiginous medullary rim with preserved internal fat and the MRI double-line sign strongly supports bone infarct.","pearl"],
      ["Red Flag","Early infarcts may appear lucent and mimic a lytic neoplasm; aggressive clinical or imaging features still require full tumor workup.","red"]
    ],
    "Presentation":[
      ["Typical Context","Bone infarcts may be incidental or occur in patients with known ischemic risk factors."],
      ["History","Ask about corticosteroid exposure, alcohol use, sickle cell disease, lupus, renal transplantation, dysbaric exposure, and other relevant systemic conditions."],
      ["Clinical Trap","The radiographic appearance may resemble enchondroma or another medullary lesion, particularly before the classic sclerosis develops."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Location</b><span>Medullary / metadiaphyseal</span></div><div class="sig"><b>XR</b><span>Serpiginous sclerosis</span></div><div class="sig"><b>Early XR</b><span>May be lucent</span></div><div class="sig"><b>T1</b><span>Low-signal serpiginous rim</span></div><div class="sig"><b>T2</b><span>Double-line sign</span></div><div class="sig"><b>Center</b><span>Preserved marrow-fat signal</span></div></div>`],
      ["Radiographs","Mature infarcts typically show serpentine bands of sclerosis separating central necrotic bone from surrounding normal bone."],
      ["MRI","On T1, the infarct is outlined by a well-defined serpiginous low-signal rim. The center largely retains normal marrow-fat signal."],
      ["Double-Line Sign","Parallel low- and high-signal bands on T2—the double-line sign—are described by OKU as essentially pathognomonic for bone infarction."],
      ["Imaging Pearl","Preserved internal fat plus a serpiginous peripheral rim is much more characteristic of infarct than a marrow-replacing neoplasm.","pearl"]
    ],
    "Pathology":[
      ["Underlying Process","The lesion reflects ischemic necrosis of bone and marrow rather than a primary neoplasm."],
      ["Maturation","Fibrosis and sclerosis develop around the necrotic region, producing the characteristic serpiginous margin seen on imaging."]
    ],
    "Treatment":[
      ["Source Emphasis","The OKU pseudotumor chapter focuses on recognition of bone infarct as a tumor mimic and does not provide a specific treatment algorithm for incidental medullary infarcts."],
      ["Clinical Approach","When imaging is classic, the major oncologic task is distinguishing infarct from a neoplasm. Atypical or aggressive findings warrant further evaluation rather than assuming infarction."]
    ],
    "Prognosis":[
      ["Natural History","Mature infarcts can remain as chronic medullary abnormalities with characteristic sclerosis and MRI morphology."],
      ["Oncologic Caution","OKU notes that malignancies can occur in bones affected by prior infarct, so new aggressive change should not be dismissed."]
    ],
    "Exam":[
      ["How to Assess","Examine the symptomatic region for focal tenderness, swelling, deformity, range-of-motion limitation, and functional impairment."],
      ["Systemic Context","Review for systemic conditions or exposures associated with osteonecrosis."],
      ["Red Flags","New progressive pain, cortical destruction, enlarging soft-tissue mass, or other aggressive change should prompt oncologic reassessment."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 5: Pseudotumors and Tumorlike Lesions — Bone Infarcts.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="enchondroma">Enchondroma</button><button data-detail="chondrosarcoma">Chondrosarcoma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},

mpnst:{
  badges:["Malignant","Soft Tissue","Peripheral nerve sheath"],
  tabs:{
    "Overview":[
      ["At a Glance","Malignant peripheral nerve sheath tumor (MPNST) is an aggressive soft-tissue sarcoma arising from peripheral nerves or preexisting nerve sheath tumors. It is particularly associated with neurofibromatosis type 1 (NF1)."],
      ["Clinical Pearl","Increasing size and new pain in a previously stable neurofibroma are classic warning signs for malignant transformation.","pearl"],
      ["Red Flag","A rapidly enlarging painful nerve-associated mass—especially in a patient with NF1—requires urgent sarcoma workup.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","MPNSTs are often fast growing and high grade. Symptoms may include enlarging mass, pain, paresthesias, weakness, or other neurologic deficits related to the involved nerve."],
      ["NF1 Association","MPNST frequently develops in the setting of multiple or plexiform neurofibromas, and patients with NF1 have a markedly increased risk."],
      ["What to Ask","Document rate of growth, new or worsening pain, baseline neurologic function, known NF1, prior radiation, and prior nerve-sheath tumor history."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Origin</b><span>Major or small peripheral nerve</span></div><div class="sig"><b>Growth</b><span>Rapid / enlarging</span></div><div class="sig"><b>MRI</b><span>Heterogeneous sarcoma pattern</span></div><div class="sig"><b>Necrosis</b><span>May be present</span></div><div class="sig"><b>PET</b><span>May aid evaluation of malignant change</span></div><div class="sig"><b>Chest</b><span>CT for metastatic staging</span></div></div>`],
      ["MRI","MRI is used to define local extent, relationship to the parent nerve and adjacent structures, and to identify features of aggressive soft-tissue sarcoma."],
      ["PET","OKU notes growing interest in PET to evaluate neurofibromas for malignant transformation, particularly when clinical behavior changes."],
      ["Imaging Pearl","Imaging is important, but a change in symptoms—especially pain and rapid enlargement—is a major diagnostic clue.","pearl"]
    ],
    "Pathology":[
      ["Histology","MPNST most commonly shows fascicles of malignant spindle cells with frequent mitotic figures. Epithelioid morphology may occur and can complicate diagnosis."],
      ["Immunohistochemistry","S100 expression may be present, but no single histologic or immunohistochemical feature is completely specific."],
      ["Biologic Context","Malignant transformation in NF1-associated tumors requires additional molecular events beyond NF1 loss alone."]
    ],
    "Staging & Workup":[
      ["Local Staging","Contrast-enhanced MRI defines tumor extent and relationship to major nerves, vessels, and muscles."],
      ["Systemic Staging","As with other high-grade soft-tissue sarcomas, chest CT is central because hematogenous pulmonary spread is the major metastatic pattern."],
      ["Biopsy","Image-guided core biopsy should be performed through a sarcoma center with the definitive resection plan in mind."],
      ["NF1 Context","Any rapidly changing plexiform or large neurofibroma in NF1 should be evaluated for malignant transformation."]
    ],
    "Treatment":[
      ["Surgery","Complete wide surgical resection with negative margins is the principal local treatment when feasible."],
      ["Radiation","Radiation may be incorporated for local control according to size, grade, margin status, and anatomic constraints."],
      ["Systemic Therapy","Chemotherapy decisions follow high-grade soft-tissue sarcoma principles and are individualized."],
      ["NP / Clinic Workflow","Track neurologic deficits, pain, wound healing, local recurrence, chest surveillance, and functional recovery after nerve-sacrificing or limb-salvage procedures."]
    ],
    "Prognosis":[
      ["Aggressive Behavior","MPNST typically behaves aggressively, and most tumors are high grade."],
      ["Survival","OKU cites reported 5-year survival rates around 30%–40%."],
      ["Risk Context","Radiation-induced MPNST carries a particularly poor prognosis and requires long-term surveillance."]
    ],
    "Exam":[
      ["How to Assess","Palpate the mass, document size and tenderness, and evaluate fixation along the course of the involved nerve."],
      ["Motor Exam","Test all motor groups supplied by the affected nerve and grade strength side-to-side."],
      ["Sensory Exam","Map sensory loss, paresthesias, allodynia, and neuropathic pain in the involved nerve distribution."],
      ["Tinel / Function","Assess Tinel response when appropriate, gait or upper-extremity function, and any progressive neurologic deficit."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 28: Soft-Tissue Sarcomas — Nerve-Associated Sarcomas / MPNST.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="neurofibroma">Neurofibroma</button><button data-detail="schwannoma">Schwannoma</button><button data-detail="sts">Soft-Tissue Sarcoma</button></div>`]
    ]
  }
},

dfsp:{
  badges:["Malignant","Soft Tissue","Fibroblastic"],
  tabs:{
    "Overview":[
      ["At a Glance","Dermatofibrosarcoma protuberans (DFSP) is a typically low-grade superficial sarcoma of the skin and subcutaneous tissue with strong local infiltrative behavior. A subset develops higher-grade fibrosarcomatous transformation."],
      ["Molecular Feature","DFSP is associated with a characteristic COL1A1-PDGFB fusion from t(17;22)."],
      ["Clinical Pearl","A slowly enlarging superficial plaque or nodular mass present for months to years can still represent DFSP despite its indolent tempo.","pearl"],
      ["Red Flag","Fibrosarcomatous transformation increases biologic aggressiveness and metastatic potential compared with conventional DFSP.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Patients are often young adults with a superficial, painless mass involving skin and subcutaneous fat. Lesions may be present for months or years before presentation."],
      ["Growth Pattern","DFSP spreads along the subdermal plane and may extend farther than the visible or palpable lesion suggests."],
      ["What to Ask","Document duration, progressive enlargement, prior excision or recurrence, skin changes, and any new rapid growth suggesting fibrosarcomatous change."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Depth</b><span>Dermal / subcutaneous</span></div><div class="sig"><b>Spread</b><span>Along subdermal plane</span></div><div class="sig"><b>MRI</b><span>Useful for deep or extensive disease</span></div><div class="sig"><b>Recurrence</b><span>Assess surgical bed if concern</span></div><div class="sig"><b>High Grade</b><span>More aggressive solid component</span></div><div class="sig"><b>Chest</b><span>Staging if fibrosarcomatous/high-risk</span></div></div>`],
      ["Local Imaging","MRI can be useful when the lesion is large, recurrent, deep, or when the true subcutaneous extent is uncertain."],
      ["Imaging Pearl","The visible skin lesion may underestimate lateral subdermal spread, which is why local-control planning must account for occult extension.","pearl"]
    ],
    "Pathology":[
      ["Conventional DFSP","The tumor is a dermal spindle-cell neoplasm with infiltrative growth into subcutaneous fat."],
      ["Molecular Diagnosis","COL1A1-PDGFB fusion is characteristic and can support diagnosis."],
      ["Fibrosarcomatous DFSP","Higher-grade areas show increased atypia, mitotic activity, and a fibrosarcoma-like architecture."]
    ],
    "Staging & Workup":[
      ["Local Workup","Careful examination and MRI are considered when lesion size, recurrence, or depth makes extent uncertain."],
      ["Biopsy","Tissue diagnosis should be established before definitive wide excision in clinically significant or atypical cases."],
      ["Metastatic Staging","Routine metastatic risk is low in conventional DFSP; staging becomes more relevant in fibrosarcomatous or otherwise high-risk disease."]
    ],
    "Treatment":[
      ["Surgery","Wide local resection is the primary treatment. Generous skin and subcutaneous resection may be required because of extensive superficial spread."],
      ["Margins","Intraoperative margin assessment can be helpful. Large defects may require skin grafting or soft-tissue reconstruction."],
      ["Systemic Therapy","Targeted therapy against PDGFB signaling may be relevant in selected unresectable, recurrent, or advanced disease, but OKU primarily emphasizes surgery for localized disease."],
      ["NP / Clinic Workflow","Monitor wounds, grafts/flaps, local recurrence, scar changes, and any new nodularity or rapid growth."]
    ],
    "Prognosis":[
      ["Conventional DFSP","Localized conventional DFSP generally has favorable survival but a meaningful local recurrence risk if margins are inadequate."],
      ["Fibrosarcomatous Change","Fibrosarcomatous transformation worsens prognosis and raises concern for metastatic spread."],
      ["Surveillance","Long-term inspection and palpation of the surgical bed are important because recurrence may be superficial and clinically detectable."]
    ],
    "Exam":[
      ["How to Assess","Inspect the skin carefully, measure the visible lesion and surrounding induration, palpate the subcutaneous extent, and assess fixation to deeper fascia."],
      ["Regional Assessment","Inspect for satellite nodules or recurrent lesions around a prior surgical scar."],
      ["Nodes / Neurovascular","Regional nodal and neurovascular assessment should be performed when clinically indicated by lesion location or higher-grade transformation."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 28: Soft-Tissue Sarcomas — Dermatofibrosarcoma Protuberans.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="sts">Soft-Tissue Sarcoma</button><button data-detail="desmoid">Desmoid-Type Fibromatosis</button></div>`]
    ]
  }
},

osteomyelitis:{
  badges:["Tumor-like","Bone","Mimic"],
  tabs:{
    "Overview":[
      ["At a Glance","Osteomyelitis is a bone infection that can closely mimic benign or malignant bone tumors clinically and radiographically. Brodie abscess is a subacute localized form that may resemble a lucent bone neoplasm."],
      ["Clinical Pearl","Infection can produce both aggressive and indolent imaging patterns; clinical context and laboratory data are essential.","pearl"],
      ["Red Flag","A presumed tumor with fever, inflammatory symptoms, abscess formation, or peripheral rim enhancement should keep infection high in the differential—but infection and sarcoma can still overlap.","red"]
    ],
    "Presentation":[
      ["Acute Osteomyelitis","Patients may present with bone pain, fever, swelling, and tenderness, sometimes without an obvious source of infection."],
      ["Subacute / Chronic Osteomyelitis","Symptoms may be mild, with only localized discomfort, and physical examination may be relatively unrevealing."],
      ["Risk Factors","Ask about immune deficiency, poor nutrition, prior trauma or surgery, contiguous infection, travel, and other infection risks."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>XR</b><span>Normal early or destructive later</span></div><div class="sig"><b>Pattern</b><span>Geographic or permeative</span></div><div class="sig"><b>Acute</b><span>Lamellar periosteal reaction</span></div><div class="sig"><b>Chronic</b><span>Solid mature periosteal bone</span></div><div class="sig"><b>MRI T1</b><span>Low signal</span></div><div class="sig"><b>MRI T2</b><span>High signal</span></div></div>`],
      ["Plain Radiographs","Depending on timing and severity, radiographs may be normal or may show geographic or permeative bone destruction. Acute infection can mimic Ewing sarcoma; chronic infection can mimic osteoid osteoma or other sclerotic lesions."],
      ["MRI","Infected bone is typically low signal on T1 and high signal on T2, which overlaps substantially with neoplasm."],
      ["Abscess Pattern","When a bone abscess is present, gadolinium-enhanced MRI often shows peripheral rather than internal enhancement, which can favor infection."],
      ["Brodie Abscess","A Brodie abscess may appear as a focal lucent lesion with surrounding sclerosis and can overlap with osteoid osteoma or other benign bone lesions."],
      ["Imaging Pearl","Peripheral rim enhancement of an abscess is useful, but no single imaging feature should override the full clinical, laboratory, and pathologic picture.","pearl"]
    ],
    "Pathology":[
      ["Diagnosis","Definitive evaluation may require culture and tissue sampling when imaging cannot confidently separate infection from tumor."],
      ["Chronic Infection","Sequestrum and devitalized bone can sustain chronic infection and may require operative removal."],
      ["Oncology Pearl","When sarcoma remains in the differential, biopsy should be planned using oncologic principles rather than assuming infection."]
    ],
    "Treatment":[
      ["Antibiotics","Treatment requires an appropriate antimicrobial course directed by culture results and the clinical setting."],
      ["Surgery","Aggressive débridement of sequestrum and other devitalized tissue is indicated when required for source control."],
      ["Multidisciplinary Care","Complex cases may require orthopaedic surgery, infectious disease, radiology, and pathology collaboration."],
      ["NP / Clinic Workflow","Track pain, fever, wound/drainage, inflammatory markers, culture results, antibiotic tolerance, and interval imaging."]
    ],
    "Prognosis":[
      ["Acute Disease","Timely diagnosis and targeted treatment generally improve the likelihood of eradication."],
      ["Chronic Disease","Chronic osteomyelitis may recur if devitalized bone or persistent infection remains."],
      ["Follow-up","Clinical response, inflammatory markers, wound status, and imaging evolution guide follow-up."]
    ],
    "Exam":[
      ["How to Assess","Inspect for erythema, swelling, drainage, sinus tract, and surgical scars; palpate for focal tenderness and warmth."],
      ["Functional Exam","Assess adjacent joint motion, gait or limb use, and pain with loading."],
      ["Neurovascular Exam","Document distal motor, sensory, pulses, and perfusion when swelling, fracture, or major débridement is involved."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 5: Pseudotumors and Tumorlike Lesions — Infection / Osteomyelitis.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="osteoid-osteoma">Osteoid Osteoma</button><button data-detail="ewing">Ewing Sarcoma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},

sts:{
  badges:["Malignant","Soft Tissue","Sarcoma"],
  tabs:{
    "Overview":[
      ["At a Glance","Soft-tissue sarcoma (STS) is a heterogeneous group of malignant mesenchymal tumors. Evaluation and treatment depend on histologic subtype, grade, size, depth, anatomic location, metastatic disease, and patient factors."],
      ["Clinical Pearl","A soft-tissue mass that is larger than 5 cm or deep to the fascia should be treated as a sarcoma until proven otherwise and evaluated at a sarcoma center.","pearl"],
      ["Red Flag","Avoid unplanned excision. MRI, staging studies, and core biopsy should be completed before definitive surgery when sarcoma is suspected.","red"]
    ],
    "Presentation":[
      ["History","Document size, location, depth, duration, rate of growth, pain, skin changes, swelling, prior trauma, anticoagulant use, prior malignancy, and systemic symptoms."],
      ["Exam","Assess size, firmness, mobility, depth relative to fascia, skin involvement, nearby joint function, and regional neurovascular status."],
      ["Reassuring Features","A small, soft, superficial mass that has remained stable for years is less likely to be malignant, though imaging or biopsy is used when clinical concern remains."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>First Line</b><span>Radiographs ± ultrasound</span></div><div class="sig"><b>Preferred Cross-sectional</b><span>MRI</span></div><div class="sig"><b>MRI Goal</b><span>Extent, necrosis, NV relation</span></div><div class="sig"><b>Contrast</b><span>Helps solid/cystic distinction & biopsy planning</span></div><div class="sig"><b>Restaging</b><span>MRI after neoadjuvant therapy</span></div><div class="sig"><b>Surveillance</b><span>Local bed + chest imaging</span></div></div>`],
      ["MRI","MRI is the preferred modality for defining the character and extent of a suspicious soft-tissue mass and its relationship to vital structures."],
      ["Biopsy Planning","Imaging should guide the most appropriate biopsy target so diagnostic tissue is obtained while minimizing contamination."],
      ["Imaging Pearl","Margins in soft-tissue tumor imaging do not carry the same biologic implications as the zone of transition in bone lesions.","pearl"]
    ],
    "Pathology":[
      ["Diagnosis","Pretreatment diagnosis integrates history, examination, imaging, and biopsy."],
      ["Tissue Analysis","Morphology is primary, with immunohistochemistry and molecular studies added when needed to establish a specific subtype."],
      ["Biopsy","Image-guided core biopsy is widely accepted and should ideally be performed at the institution where definitive treatment will occur."]
    ],
    "Staging & Workup":[
      ["Staging","Stage is assigned before definitive treatment using the applicable AJCC soft-tissue sarcoma system."],
      ["Chest","The lungs are the most common site of distant metastasis for many STS subtypes, so chest imaging is a central part of staging."],
      ["Nodes","Regional nodal evaluation is especially considered in subtypes with greater lymphatic spread, including synovial sarcoma."],
      ["Multidisciplinary Review","Treatment planning should occur in a multidisciplinary sarcoma setting."]
    ],
    "Treatment":[
      ["Surgery","Wide resection with negative margins is the foundation of treatment for localized resectable STS."],
      ["Radiation / Chemotherapy","Radiation and chemotherapy are used selectively according to stage, grade, subtype, margins, and resectability."],
      ["Positive Margins / Unplanned Excision","Re-excision and/or radiation should be considered when margins are positive or after an unplanned excision."],
      ["NP / Clinic Workflow","Coordinate biopsy, staging, radiation or systemic therapy, wound management, rehabilitation, and scheduled local/chest surveillance."]
    ],
    "Prognosis":[
      ["Key Factors","Outcome varies substantially by tumor biology, histologic subtype, grade, size, depth, metastatic status, and adequacy of local control."],
      ["Local Recurrence","Local recurrence is associated with poorer outcomes, making planned negative-margin surgery and surveillance important."],
      ["Surveillance","Follow-up includes physical examination plus imaging of the surgical bed and anatomic sites at risk for metastasis."]
    ],
    "Exam":[
      ["How to Assess","Measure the mass, determine whether it is superficial or deep, assess mobility/fixation and tenderness, and evaluate skin and nearby joint motion."],
      ["Neurovascular Exam","Document motor, sensory, pulses, and perfusion when the tumor approaches major neurovascular structures."],
      ["Regional Nodes","Palpate regional lymph nodes when the histologic subtype has meaningful nodal metastatic potential."]
    ],
    "References":[
      ["Primary Sources",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapters 28–29: Soft-Tissue Sarcomas and Management of Soft-Tissue Sarcomas.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="liposarcoma">Liposarcoma</button><button data-detail="synovial-sarcoma">Synovial Sarcoma</button></div>`]
    ]
  }
},

liposarcoma:{
  badges:["Malignant","Soft Tissue","Adipocytic"],
  tabs:{
    "Overview":[
      ["At a Glance","Liposarcoma includes several malignant adipocytic sarcoma subtypes with different imaging appearances, molecular features, treatment responses, and metastatic patterns."],
      ["Key Subtypes","Clinically important categories include well-differentiated/atypical lipomatous tumor, dedifferentiated liposarcoma, myxoid liposarcoma, and pleomorphic liposarcoma."],
      ["Clinical Pearl","A predominantly fatty tumor with a new nonfatty enhancing component raises concern for dedifferentiated liposarcoma.","pearl"],
      ["Red Flag","Myxoid liposarcoma can metastasize to nonpulmonary sites, so surveillance may need to extend beyond routine chest imaging.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Patients may have few symptoms despite a large mass, particularly in the thigh or pelvis."],
      ["Age","Myxoid liposarcoma commonly affects adults aged 30–60; pleomorphic liposarcoma tends to occur in older adults."],
      ["Symptoms","Pain is not required. Size, mass effect, or compression of adjacent structures may drive presentation."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>ALT/WDL</b><span>Predominantly fatty, bland MRI</span></div><div class="sig"><b>Dediff.</b><span>Nonlipomatous heterogeneous component</span></div><div class="sig"><b>Myxoid</b><span>Myxoid high-water-content appearance</span></div><div class="sig"><b>MRI</b><span>Defines local extent</span></div><div class="sig"><b>Chest</b><span>Routine metastatic staging</span></div><div class="sig"><b>Myxoid</b><span>Consider broader surveillance</span></div></div>`],
      ["Dedifferentiated Liposarcoma","MRI shows heterogeneous nonlipomatous regions juxtaposed with lower-grade fatty tumor."],
      ["Myxoid Liposarcoma","Myxoid tumors may be large with relatively few symptoms and have a distinctive myxoid background."],
      ["Imaging Pearl","Do not assume all liposarcomas behave or image like fatty tumors; dedifferentiated and myxoid components can substantially change the appearance.","pearl"]
    ],
    "Pathology":[
      ["MDM2","MDM2 amplification is an important molecular feature in well-differentiated/atypical lipomatous tumors and dedifferentiated liposarcoma."],
      ["Dedifferentiation","Dedifferentiated liposarcoma shows high-grade nonlipogenic sarcoma adjacent to lower-grade lipomatous tumor."],
      ["Myxoid Genetics","Myxoid liposarcoma characteristically carries a t(12;16) translocation and shows a myxoid histologic background."],
      ["Pleomorphic","Pleomorphic liposarcoma requires identification of lipoblastic differentiation and may be diagnostically challenging."]
    ],
    "Staging & Workup":[
      ["Local Staging","MRI defines tumor extent, relationship to fascia, neurovascular structures, and nonfatty components."],
      ["Systemic Staging","Chest imaging is standard for soft-tissue sarcoma staging."],
      ["Myxoid Exception","Because myxoid liposarcoma can metastasize to unconventional nonpulmonary sites, broader surveillance such as abdomen/pelvis imaging may be appropriate."],
      ["Biopsy","Image-guided core biopsy should target representative solid/nonfatty regions when heterogeneous tumor is present."]
    ],
    "Treatment":[
      ["Surgery","Wide resection with negative margins is the core local treatment for resectable liposarcoma."],
      ["Radiation / Chemotherapy","Use depends on subtype, grade, depth, size, resectability, and metastatic status. Myxoid liposarcoma is relatively more responsive to chemotherapy and radiation than many other STS subtypes."],
      ["NP / Clinic Workflow","Track wound healing, limb function, local recurrence, chest surveillance, and subtype-specific metastatic surveillance."]
    ],
    "Prognosis":[
      ["Subtype Matters","Prognosis differs substantially by histologic subtype and grade."],
      ["Myxoid","A greater round-cell component is associated with worse prognosis."],
      ["Dedifferentiated","Dedifferentiation indicates higher-grade biology and greater metastatic potential than ALT/WDL."]
    ],
    "Exam":[
      ["How to Assess","Document size, depth, firmness, mobility, tenderness, skin change, and adjacent joint function."],
      ["Neurovascular Exam","Assess motor/sensory function and perfusion when the tumor is near major nerves or vessels."],
      ["Post-op Follow-up","Examine the surgical bed for recurrent fullness or nodularity and assess treatment-related stiffness or edema."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 28: Soft-Tissue Sarcomas — Lipomatous Sarcomas.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="alt">Atypical Lipomatous Tumor</button><button data-detail="sts">Soft-Tissue Sarcoma</button></div>`]
    ]
  }
},

"synovial-sarcoma":{
  badges:["Malignant","Soft Tissue","Translocation-associated"],
  tabs:{
    "Overview":[
      ["At a Glance","Synovial sarcoma is a malignant soft-tissue sarcoma that often occurs near joints but rarely originates within the joint itself. Patients are often younger than the typical adult soft-tissue sarcoma population."],
      ["Clinical Pearl","Despite the name, synovial sarcoma is not simply a tumor of synovium; many arise in deep soft tissues near large joints.","pearl"],
      ["Red Flag","Some synovial sarcomas remain small or indolent for years, so slow growth does not exclude malignancy.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Presentation ranges from a small painless mass to a large rapidly growing deep extremity tumor."],
      ["Location","Juxta-articular locations are common, and pediatric patients can occasionally present with joint contracture."],
      ["Clinical Trap","Its sometimes indolent course can delay diagnosis and lead to unplanned excision."]
    ],
    "Imaging":[
      ["Imaging Signature",`<div class="siggrid"><div class="sig"><b>Location</b><span>Often juxta-articular</span></div><div class="sig"><b>Size</b><span>Small or large</span></div><div class="sig"><b>MRI</b><span>Deep soft-tissue mass</span></div><div class="sig"><b>Behavior</b><span>May appear deceptively indolent</span></div><div class="sig"><b>Nodes</b><span>Higher nodal risk than many STS</span></div><div class="sig"><b>Staging</b><span>Local MRI + systemic workup</span></div></div>`],
      ["MRI","MRI defines extent, relationship to nearby muscle, joint, and neurovascular structures, and guides biopsy."],
      ["Imaging Pearl","A small periarticular mass in a young adult should not be dismissed solely because it has been present for a long time.","pearl"]
    ],
    "Pathology":[
      ["Histology","Synovial sarcoma may show monophasic or biphasic architecture with spindle-cell and epithelial components."],
      ["Molecular Diagnosis","Most tumors contain the characteristic t(X;18)(p11.2;q11.2) translocation, producing SS18-SSX fusion products such as SS18-SSX1 or SS18-SSX2."],
      ["Differential","Histology and immunohistochemistry can overlap with malignant peripheral nerve sheath tumor, so molecular confirmation is valuable."]
    ],
    "Staging & Workup":[
      ["Local Staging","MRI is used for surgical planning and to define tumor extent."],
      ["Systemic Staging","Chest imaging is part of metastatic staging."],
      ["Regional Nodes","Synovial sarcoma is among the STS subtypes with a higher incidence of nodal metastasis; regional nodal assessment may be considered."],
      ["Biopsy","Core biopsy should be performed before definitive treatment with tissue available for molecular testing."]
    ],
    "Treatment":[
      ["Surgery","Wide surgical excision with negative margins is the principal local treatment when feasible."],
      ["Radiation","Radiation is incorporated according to size, depth, margin status, and overall local-control strategy."],
      ["Chemotherapy","Synovial sarcoma is considered relatively chemosensitive among soft-tissue sarcomas, although use of adjuvant systemic therapy varies by center and patient/tumor factors."],
      ["NP / Clinic Workflow","Track local control, wound and functional recovery, chest surveillance, and regional nodes when clinically relevant."]
    ],
    "Prognosis":[
      ["Risk Factors","Outcome depends on size, depth, grade, metastatic status, and adequacy of local control."],
      ["Delayed Diagnosis","Indolent growth can lead to delayed diagnosis or unplanned excision, complicating definitive management."],
      ["Surveillance","Long-term local and systemic surveillance is required because recurrence and metastasis remain possible."]
    ],
    "Exam":[
      ["How to Assess","Measure and palpate the mass, determine depth/fixation, assess nearby joint motion, and document pain or contracture."],
      ["Neurovascular Exam","Document motor, sensory, pulses, and perfusion in the involved extremity."],
      ["Regional Nodes","Examine the regional nodal basin because synovial sarcoma has greater nodal metastatic potential than many other STS subtypes."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 28: Soft-Tissue Sarcomas — Synovial Sarcoma.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="sts">Soft-Tissue Sarcoma</button><button data-detail="mpnst">Malignant Peripheral Nerve Sheath Tumor</button></div>`]
    ]
  }
},

adamantinoma:{
  badges:["Malignant","Bone","Epithelial"],
  tabs:{
    "Overview":[
      ["At a Glance","Adamantinoma is a rare, low-grade malignant epithelial tumor of bone with a strong predilection for the anterior tibial diaphysis."],
      ["Typical Location","Approximately 90% arise in the tibia, usually along the anterior cortex. The fibula may be involved synchronously or by contiguous spread."],
      ["Clinical Pearl","Anterior tibial diaphyseal lesion + epithelial tumor islands in a fibrous/osteofibrous background is the classic adamantinoma pattern.","pearl"],
      ["Red Flag","Late recurrence and pulmonary metastases can occur decades after treatment, so surveillance must be long term.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Patients are often young adults and may present with slowly progressive pain, swelling, or deformity. Symptoms can be longstanding because of the tumor’s low-grade behavior."],
      ["Physical Exam","Inspect the tibial contour, palpate for tenderness or cortical prominence, assess gait, and document nearby joint motion and neurovascular status."],
      ["Differential Context","The differential includes osteofibrous dysplasia and osteofibrous dysplasia–like adamantinoma, especially in younger patients."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Location</b><span>Anterior tibial diaphysis</span></div><div class="sig"><b>Compartment</b><span>Cortical ± medullary extension</span></div><div class="sig"><b>Pattern</b><span>Multiloculated / lytic-sclerotic</span></div><div class="sig"><b>MRI</b><span>Defines medullary and soft-tissue extent</span></div><div class="sig"><b>OFD-AD</b><span>Often intracortical</span></div><div class="sig"><b>Classic AD</b><span>Medullary involvement common</span></div></div>`],
      ["MRI","MRI is not diagnostic by itself but is important for defining the anatomic extent of tumor and for surgical planning. Medullary involvement favors classic adamantinoma over osteofibrous dysplasia/OFD-like adamantinoma."],
      ["Imaging Pearl","The combination of tibial cortical location and medullary extension should heighten concern for classic adamantinoma.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/adamantinoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Adamantinoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Classic Histology","Classic adamantinoma is composed of islands or nests of malignant epithelial cells within bland fibrous stroma. Basaloid, spindle/sarcomatoid, squamoid, and tubular patterns are described."],
      ["OFD-like Variant","OFD-like adamantinoma contains predominantly osteofibrous tissue with small epithelial nests. Cytokeratin staining helps identify epithelial differentiation."],
      ["Biopsy","OKU notes that definitive diagnosis often requires open biopsy when distinction from osteofibrous dysplasia/OFD-like adamantinoma is critical."]
    ],
    "Staging & Workup":[
      ["Local Staging","Radiographs and MRI define cortical, medullary, and soft-tissue extent."],
      ["Systemic Staging","Because metastases can occur, systemic staging includes attention to the lungs and other sites as clinically indicated."],
      ["Biopsy Strategy","Biopsy must be planned with the definitive resection in mind and should be performed through the treating orthopaedic oncology team."]
    ],
    "Treatment":[
      ["Definitive Treatment","Classic adamantinoma requires wide surgical resection, generally followed by reconstruction."],
      ["What Not to Do","Marginal or intralesional excision increases the risk of local recurrence and distant metastasis."],
      ["Systemic / Radiation Therapy","OKU notes that chemotherapy and radiation therapy have not demonstrated effectiveness for classic adamantinoma."],
      ["NP / Clinic Workflow","Track long-term local recurrence, pulmonary surveillance, reconstruction status, gait/function, and late complications."]
    ],
    "Prognosis":[
      ["Long-Term Outlook","Disease-specific survival can remain high at 10 years, but late recurrences and metastases substantially affect very long-term outcomes."],
      ["Late Events","Recurrence and metastases have been reported up to 30 years after resection."],
      ["Surveillance","Long-term follow-up beyond 10 years is recommended because of the potential for very late metastatic disease."]
    ],
    "Exam":[
      ["How to Assess","Inspect tibial alignment and contour, palpate the lesion, evaluate knee and ankle range of motion, and assess gait."],
      ["Neurovascular Exam","Document distal motor, sensory, pulses, and perfusion before and after resection/reconstruction."],
      ["Functional Follow-up","Assess weight-bearing tolerance, limb-length or alignment changes, and reconstruction-related symptoms over time."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 18: Miscellaneous Malignant Primary Bone Tumors — Adamantinoma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Adamantinoma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="fibrous-dysplasia">Fibrous Dysplasia</button><button data-detail="osteosarcoma">Osteosarcoma</button></div>`]
    ]
  }
},

myeloma:{
  badges:["Malignant","Bone","Hematologic"],
  tabs:{
    "Overview":[
      ["At a Glance","Multiple myeloma is a clonal plasma-cell malignancy characterized by monoclonal immunoglobulin production and a strong predilection for osteolytic skeletal disease."],
      ["Orthopaedic Relevance","Osseous lesions are a hallmark of myeloma, and orthopaedic teams often contribute to diagnosis, fracture prevention, stabilization, and preservation of function."],
      ["Clinical Pearl","Myeloma lesions are overwhelmingly lytic and may remain radiographically lucent even when systemic disease is responding because cortical/trabecular bone may not fully reconstitute.","pearl"],
      ["Red Flag","Spinal cord compression, impending or completed long-bone fracture, and painful lytic lesions in weight-bearing bone require urgent structural assessment.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Bone pain, pathologic fracture, vertebral compression fracture, fatigue from anemia, hypercalcemia, renal dysfunction, and recurrent infections may occur."],
      ["CRAB Features","Classic organ-damage features include hypercalcemia, renal insufficiency, anemia, and bone lesions."],
      ["Orthopaedic Presentation","Some patients first present to orthopaedics with focal pain or fracture before the plasma-cell disorder has been diagnosed."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Pattern</b><span>Predominantly lytic</span></div><div class="sig"><b>Skull</b><span>Punched-out lesions</span></div><div class="sig"><b>Bone Scan</b><span>Often underestimates disease</span></div><div class="sig"><b>CT</b><span>More sensitive for lytic disease</span></div><div class="sig"><b>Post-treatment</b><span>Thin sclerotic rim may develop</span></div><div class="sig"><b>Key Risk</b><span>Fracture / spinal instability</span></div></div>`],
      ["Plain Radiographs","Historically, skeletal survey was used to identify punched-out lytic lesions. Radiographs may miss early marrow disease and are limited for response assessment."],
      ["Bone Scan","Technetium bone scan is not part of the standard myeloma skeletal evaluation because predominantly lytic lesions may show relatively little osteoblastic activity."],
      ["CT / Advanced Imaging","Whole-body low-dose CT is more sensitive than skeletal survey for osseous lesions, particularly in the axial skeleton."],
      ["Imaging Pearl","A negative bone scan does not exclude extensive myeloma bone disease.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/multiple-myeloma" target="_blank" rel="noopener noreferrer">Radiopaedia: Multiple myeloma ↗</a></div>`]
    ],
    "Pathology":[
      ["Diagnosis","Diagnosis requires evidence of a clonal plasma-cell process, usually with bone marrow sampling, together with appropriate clinical criteria."],
      ["Immunophenotype","CD138 immunostaining and flow cytometry may help in challenging cases."],
      ["Cytogenetics","Karyotyping and fluorescence in situ hybridization are standard because genetic abnormalities carry prognostic and potential therapeutic significance."]
    ],
    "Staging & Workup":[
      ["Laboratory Workup","Evaluation includes monoclonal protein studies plus assessment of hemoglobin, calcium, creatinine/renal function, and other markers of tumor burden."],
      ["Bone Marrow","Bone marrow aspirate/biopsy is central to diagnosis and risk stratification."],
      ["Whole-Body Imaging","Whole-body skeletal imaging is indicated to define osseous disease and identify lesions at risk for pathologic fracture."],
      ["Staging","The International Staging System incorporates serum β2-microglobulin and albumin; current hematology practice may add additional molecular risk stratification."]
    ],
    "Treatment":[
      ["Systemic Therapy","Definitive disease treatment is hematologic/oncologic and systemic. Orthopaedic care focuses on skeletal complications."],
      ["Radiation","Myeloma is highly radiosensitive; radiation is commonly used for painful bone lesions or soft-tissue tumor causing neurologic compression."],
      ["Surgery","Surgery is reserved mainly for biopsy, mechanical instability, pathologic fracture, impending fracture, or acute structural neural compression."],
      ["Long-Bone Fixation","Entire involved bones should be protected when stabilization is indicated. Intramedullary devices, plates, cement augmentation, or arthroplasty may be selected according to anatomy and defect."],
      ["NP / Clinic Workflow","Track pain, weight-bearing status, fracture risk, neurologic symptoms, systemic therapy timing, radiation plans, and perioperative risks including anemia and thrombosis."]
    ],
    "Prognosis":[
      ["Skeletal Healing","Systemic therapy and antiresorptive treatment may improve structural risk, but existing lytic defects often do not fully reconstitute."],
      ["Orthopaedic Goal","The orthopaedic objective is durable function for the patient's expected lifespan, with prophylactic stabilization preferred over treating a completed fracture when appropriate."],
      ["Follow-up","Serial imaging is driven by symptoms, structural risk, treatment response, and hematology/oncology surveillance."]
    ],
    "Exam":[
      ["How to Assess","Localize focal bony tenderness, assess weight-bearing and gait, evaluate long-bone pain with activity, and check for deformity or signs of completed fracture."],
      ["Spine","Assess for vertebral tenderness, weakness, sensory change, gait disturbance, and bowel/bladder dysfunction when spinal disease is present."],
      ["Perioperative Assessment","Document baseline function and consider anemia, hyperviscosity symptoms, thrombotic risk, and systemic treatment status when planning surgery."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 19: Multiple Myeloma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Multiple myeloma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="lymphoma">Primary Bone Lymphoma</button><button data-route="metastatic">Metastatic Bone Disease</button></div>`]
    ]
  }
},

lymphoma:{
  badges:["Malignant","Bone","Hematologic"],
  tabs:{
    "Overview":[
      ["At a Glance","Primary bone lymphoma is lymphoma confined to a single bony site, with or without a single regional lymph node, and no other sites of involvement during the initial diagnostic interval. Most cases are diffuse large B-cell lymphoma."],
      ["Typical Location","The axial skeleton and metaphyseal regions of long bones such as the femur, humerus, and tibia are common sites."],
      ["Clinical Pearl","A marrow-replacing lesion with a large soft-tissue component but relatively subtle early radiographic change can be lymphoma.","pearl"],
      ["Red Flag","Persistent night pain, constitutional symptoms, or a permeative marrow lesion should prompt lymphoma in the differential—even if plain radiographs are initially normal.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Pain with activity and at rest is common, and night pain may wake patients from sleep. Pathologic fracture can be the presenting event."],
      ["Systemic Symptoms","Fever, night sweats, weight loss, and prolonged lymphadenopathy are concerning, although isolated primary bone lymphoma may lack systemic symptoms."],
      ["Orthopaedic Presentation","Patients may be referred after MRI for an apparently unrelated musculoskeletal complaint reveals marrow abnormality."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Early XR</b><span>May be normal</span></div><div class="sig"><b>Pattern</b><span>Poorly defined permeative lysis</span></div><div class="sig"><b>MRI T1</b><span>Low signal marrow replacement</span></div><div class="sig"><b>MRI T2</b><span>High signal / edema</span></div><div class="sig"><b>Soft Tissue</b><span>May be larger than bone component</span></div><div class="sig"><b>After Therapy</b><span>Remodeling / sclerosis may develop</span></div></div>`],
      ["Plain Radiographs","Radiographs can be normal early. Once enough mineral is lost, a poorly marginated permeative lytic pattern may appear, sometimes with cortical destruction."],
      ["MRI","MRI often reveals the lesion first. Typical findings include poorly defined marrow replacement, low T1 signal, high T2 signal, edema, cortical disruption, and a soft-tissue component."],
      ["Nuclear Imaging","FDG-PET and bone scintigraphy can show avid uptake but are nonspecific."],
      ["Imaging Pearl","Lymphoma can produce a surprisingly large soft-tissue mass relative to the degree of cortical destruction.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/primary-bone-lymphoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Primary bone lymphoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","The marrow may be replaced by sheets of atypical lymphoid cells. Diffuse large B-cell lymphoma is the most common adult subtype."],
      ["Ancillary Testing","Immunohistochemistry, flow cytometry, and FISH are commonly used together to establish lineage and subtype."],
      ["Marker Pearl","CD20 is a common B-cell marker and helps separate B-cell lymphoma from other small round blue cell tumors."]
    ],
    "Staging & Workup":[
      ["Biopsy","Tissue diagnosis is required. Adequate fresh tissue handling is important because flow cytometry and other hematopathology studies may be needed."],
      ["Systemic Staging","Staging is directed by the lymphoma team and commonly includes whole-body imaging and assessment for nodal, marrow, or extranodal disease."],
      ["Fracture Risk","Weight-bearing lytic lesions should be assessed for impending pathologic fracture because prophylactic stabilization is preferred to treatment after fracture when risk is high."]
    ],
    "Treatment":[
      ["Systemic Therapy","Primary bone lymphoma is primarily treated with systemic lymphoma-directed therapy, often with radiation depending on subtype, stage, and treatment plan."],
      ["Orthopaedic Role","Surgery is mainly for biopsy or stabilization of impending/completed pathologic fractures and structural complications."],
      ["Mechanical Strategy","In long bones requiring stabilization, the entire involved bone should be protected. Proximal femoral destruction may require prosthetic reconstruction; diaphyseal lesions may be managed with intramedullary fixation."],
      ["Timing Pearl","Because lymphoma can respond rapidly to systemic therapy and bone can regenerate substantially, the decision to operate must balance mechanical risk against delay of effective oncologic treatment.","pearl"],
      ["NP / Clinic Workflow","Track pain, functional status, fracture risk, systemic therapy timing, radiation plan, wound healing, and recovery of bone strength on follow-up imaging."]
    ],
    "Prognosis":[
      ["Primary Bone Lymphoma","Early-stage primary bone lymphoma can have an excellent prognosis. OKU cites up to approximately 90% 5-year survival when chemotherapy can be given."],
      ["Stage Matters","Prognosis worsens with increasing stage and varies by lymphoma subtype."],
      ["Functional Outlook","Because cure or long-term remission is possible, reconstruction choices should support durable long-term function."]
    ],
    "Exam":[
      ["How to Assess","Evaluate focal tenderness, swelling, deformity, range of motion, weight-bearing tolerance, and gait."],
      ["Fracture Risk","Pain with normal activity in a weight-bearing long bone should heighten concern for structural failure."],
      ["Systemic Examination","Ask about fever, night sweats, weight loss, and prolonged lymphadenopathy; document a focused neurovascular examination."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 20: Lymphoma — Primary Bone Lymphoma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Primary bone lymphoma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="myeloma">Multiple Myeloma</button><button data-detail="ewing">Ewing Sarcoma</button><button data-route="metastatic">Metastatic Bone Disease</button></div>`]
    ]
  }
},

osteosarcoma:{
  badges:["Malignant","Bone","Bone-forming"],
  tabs:{
    "Overview":[
      ["At a Glance","Conventional osteosarcoma is a high-grade intramedullary malignancy in which malignant mesenchymal cells produce osteoid. It most often presents in adolescents and young adults."],
      ["Typical Location","The metaphyses of long bones are classic sites, especially the distal femur, proximal tibia, and proximal humerus."],
      ["Clinical Pearl","A painful metaphyseal lesion in an adolescent with aggressive periosteal reaction and malignant osteoid should be considered osteosarcoma until proven otherwise.","pearl"],
      ["Red Flag","Do not perform an unplanned biopsy or excision. Biopsy should be coordinated with the orthopaedic oncology team because the biopsy tract must be incorporated into definitive resection.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Pain and swelling are the most common presenting complaints. Symptoms may initially be attributed to sports injury, trauma, or growing pains, which can delay diagnosis."],
      ["Metastatic Pattern","The lungs are the most common site of distant metastasis, followed by other bones."],
      ["Physical Exam","Document mass or swelling, tenderness, joint motion, limb function, and a complete distal neurovascular examination."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Age</b><span>Usually adolescent / young adult</span></div><div class="sig"><b>Location</b><span>Metaphysis</span></div><div class="sig"><b>Matrix</b><span>Malignant osteoid / dense mineralization</span></div><div class="sig"><b>Margin</b><span>Ill-defined / aggressive</span></div><div class="sig"><b>Periosteum</b><span>Sunburst / Codman triangle</span></div><div class="sig"><b>MRI</b><span>Marrow, soft tissue, NV relation, skip lesions</span></div></div>`],
      ["Plain Radiographs","Conventional osteosarcoma often appears as a radiodense metaphyseal lesion with ill-defined margins, distortion of the normal trabecular pattern, and aggressive periosteal reaction. Sunburst appearance and Codman triangle are classic findings."],
      ["MRI","MRI of the entire involved bone defines intramedullary extent, soft-tissue extension, proximity to neurovascular structures, and skip lesions."],
      ["Imaging Pearl","Radiographs establish the aggressive bone-forming pattern; MRI answers the surgical-planning questions.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/osteosarcoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Osteosarcoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Defining Feature","The defining pathologic feature is malignant osteoid produced directly by malignant tumor cells."],
      ["Histologic Subtypes","Conventional osteosarcoma has historically been described as osteoblastic, chondroblastic, or fibroblastic according to the dominant matrix pattern."],
      ["Biopsy Pearl","Adequate sampling is essential because variants and heterogeneous areas can mimic other aggressive bone tumors."]
    ],
    "Staging & Workup":[
      ["Local Workup","Before biopsy, evaluation includes plain radiographs and MRI of the entire involved bone."],
      ["Systemic Staging","Chest CT is used to evaluate pulmonary metastases, and whole-body bone scintigraphy remains a standard method for screening for distant skeletal metastases. PET may supplement staging in selected settings."],
      ["Biopsy","Tissue diagnosis is required and should be planned at a sarcoma center by the team that will perform definitive surgery."],
      ["Prognostic Anchor","The presence of clinically detectable metastatic disease at diagnosis is the strongest clinical prognostic factor."]
    ],
    "Treatment":[
      ["Standard Strategy","Treatment of conventional high-grade osteosarcoma combines multiagent systemic chemotherapy with definitive surgical resection to negative margins."],
      ["Limb Salvage","Most patients with localized extremity disease can undergo limb-salvage surgery when a safe oncologic resection and functional reconstruction are feasible."],
      ["Response Assessment","Pathologic percentage of tumor necrosis after neoadjuvant chemotherapy carries prognostic information and helps characterize treatment response."],
      ["NP / Clinic Workflow","Coordinate chemotherapy and surgical timelines, monitor treatment toxicities, review restaging studies, document wound and function after surgery, and track chest/local surveillance."]
    ],
    "Prognosis":[
      ["Localized Disease","OKU reports that approximately 70% of patients with localized disease can be cured with complete resection and multiagent chemotherapy."],
      ["Metastatic Disease","Prognosis is substantially worse with metastatic, unresectable, axial, or early relapsed disease."],
      ["Key Factors","Stage at diagnosis, surgical margins, and response to chemotherapy are central prognostic considerations."]
    ],
    "Exam":[
      ["How to Assess","Inspect for swelling or deformity, palpate the lesion, assess adjacent joint range of motion, gait or limb use, and pain with activity."],
      ["Neurovascular Exam","Document motor, sensory, pulses, and perfusion because neurovascular proximity directly affects limb-salvage planning."],
      ["Fracture / Urgency","Acute pain escalation, deformity, or sudden loss of function may indicate pathologic fracture and warrants urgent reassessment."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 14: Conventional Osteoblastic Osteosarcoma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Osteosarcoma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="ewing">Ewing Sarcoma</button><button data-detail="chondrosarcoma">Chondrosarcoma</button><button data-route="imaging">Bone Lesion Analysis</button></div>`]
    ]
  }
},

ewing:{
  badges:["Malignant","Bone","Small round cell"],
  tabs:{
    "Overview":[
      ["At a Glance","Ewing sarcoma is an aggressive small round cell sarcoma of bone that most often affects children and adolescents. It is defined molecularly by an EWSR1-family translocation, most commonly EWS-FLI1."],
      ["Typical Location","Common osseous sites include the lower extremity and pelvis, followed by chest wall, upper extremity, spine, and skull. Extraosseous Ewing sarcoma also occurs."],
      ["Clinical Pearl","A painful, rapidly enlarging diaphyseal or metadiaphyseal lesion with a large soft-tissue mass and onion-skin periosteal reaction is a classic Ewing pattern.","pearl"],
      ["Red Flag","Fever, elevated inflammatory markers, and a permeative bone lesion can mimic osteomyelitis. Infection-like presentation does not exclude Ewing sarcoma.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Pain, swelling, an enlarging mass, fever, fatigue, weight loss, and decreased appetite may occur. Growth can be rapid."],
      ["Neurologic Symptoms","Spinal or paraspinal disease may produce radiculopathy, myelopathy, or bowel/bladder dysfunction."],
      ["Metastatic Pattern","Spread is primarily hematogenous. Lung is the most common metastatic site, followed by bone."],
      ["Physical Exam","Look for asymmetric fullness, erythema, tenderness, motion loss, and subtle neurovascular deficits."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Age</b><span>Child / adolescent</span></div><div class="sig"><b>Location</b><span>Diaphysis / metadiaphysis</span></div><div class="sig"><b>Pattern</b><span>Permeative lytic lesion</span></div><div class="sig"><b>Periosteum</b><span>Onion skin ± Codman triangle</span></div><div class="sig"><b>Soft Tissue</b><span>Often large associated mass</span></div><div class="sig"><b>MRI</b><span>Whole bone; local extent / skip lesions</span></div></div>`],
      ["Plain Radiographs","Ewing sarcoma commonly appears as a poorly marginated, permeative lytic lesion in the diaphysis or metadiaphysis. Reactive periosteal bone formation may create an onion-skin appearance or Codman triangle."],
      ["MRI","MRI with and without contrast is preferred for local staging. Imaging of the entire bone is recommended to define intramedullary and extraosseous extent and identify skip lesions."],
      ["Imaging Pearl","A disproportionately large soft-tissue mass arising from a permeative bone lesion is a useful clue to Ewing sarcoma.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/ewing-sarcoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Ewing sarcoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Histology","Ewing sarcoma is composed of monotonous small round blue cells with a high nuclear-to-cytoplasmic ratio and little intervening stroma."],
      ["Immunohistochemistry","CD99/MIC2 is strongly expressed in most cases but is not fully specific."],
      ["Molecular Diagnosis","Cytogenetic or molecular confirmation is critical. Most tumors contain an EWSR1-ETS family fusion, most commonly EWS-FLI1."]
    ],
    "Staging & Workup":[
      ["Laboratory Assessment","Initial laboratory evaluation may include CBC, metabolic panel, ESR, CRP, and LDH. Inflammatory markers may be elevated, especially in patients with systemic symptoms."],
      ["Local Staging","Obtain radiographs and contrast-enhanced MRI of the entire involved bone."],
      ["Systemic Staging","Dedicated chest CT evaluates pulmonary metastases. Skeletal staging may include technetium bone scan, PET/CT, or whole-body MRI depending on institutional protocol."],
      ["Biopsy","Biopsy should be performed at a sarcoma center with tissue reserved for histology and molecular testing."],
      ["Prognostic Anchor","Stage at presentation is one of the strongest determinants of survival."]
    ],
    "Treatment":[
      ["Systemic Therapy","Multiagent chemotherapy is essential because occult systemic disease is assumed even when staging appears localized."],
      ["Local Control","Local control is usually surgical resection when feasible. Radiation therapy is an important option for unresectable or difficult sites and may be combined with surgery in selected situations."],
      ["Response Assessment","Pathologic necrosis after neoadjuvant therapy provides prognostic information."],
      ["NP / Clinic Workflow","Coordinate chemotherapy, local-control planning, radiation when indicated, interval imaging, toxicity surveillance, and postoperative functional recovery."]
    ],
    "Prognosis":[
      ["Localized Disease","Outcomes for localized Ewing sarcoma have improved substantially with multimodality treatment."],
      ["Metastatic Disease","Approximately one-quarter of patients may present with metastases, and metastatic disease remains the strongest adverse prognostic factor."],
      ["Additional Risk","Pelvic location and poor treatment response are associated with worse outcomes."]
    ],
    "Exam":[
      ["How to Assess","Inspect and palpate for a mass, swelling, erythema, or warmth; assess adjacent joint motion, gait, and function."],
      ["Neurovascular Exam","Carefully document motor and sensory status because deficits may be subtle despite substantial tumor burden."],
      ["Spine Red Flags","Bowel/bladder dysfunction, weakness, sensory change, or progressive radicular symptoms warrant urgent assessment."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 16: Ewing Sarcoma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Ewing sarcoma reference article. External imaging is linked rather than copied.</div>`],
      ["Cross-links",`<div class="crosslinks"><button data-detail="osteosarcoma">Osteosarcoma</button><button data-detail="chondrosarcoma">Chondrosarcoma</button></div>`]
    ]
  }
},

chondrosarcoma:{
  badges:["Malignant","Bone","Cartilage"],
  tabs:{
    "Overview":[
      ["At a Glance","Chondrosarcoma is the most common primary bone sarcoma of adulthood and comprises malignant cartilage-producing tumors with behavior ranging from indolent low-grade disease to highly aggressive high-grade or dedifferentiated sarcoma."],
      ["Clinical Context","Progressive pain and increasingly aggressive cartilage-tumor imaging features are central to diagnosis because biopsy alone may not reliably separate low-grade chondrosarcoma from benign cartilage lesions."],
      ["Clinical Pearl","Progressive pain + deep endosteal scalloping + cartilage matrix should raise concern for a malignant cartilage neoplasm.","pearl"],
      ["Red Flag","Cortical destruction, extraosseous soft-tissue mass, malignant periosteal reaction, or loss of typical cartilage mineralization suggests higher-grade disease.","red"]
    ],
    "Presentation":[
      ["Typical Presentation","Progressive pain is an important clinical feature. Swelling or a mass may occur, particularly with larger or higher-grade tumors."],
      ["Location Matters","Axial tumors, especially pelvic and spinal lesions, are more difficult to treat and generally have a poorer prognosis than comparable appendicular lesions."],
      ["History","Document pain at rest or night, interval progression, prior cartilage lesion diagnosis or surgery, and any new functional limitation."]
    ],
    "Imaging":[
      ["Radiographic Signature",`<div class="siggrid"><div class="sig"><b>Matrix</b><span>Rings / arcs / punctate calcification</span></div><div class="sig"><b>Low Grade</b><span>Deep endosteal scalloping / expansion</span></div><div class="sig"><b>Higher Grade</b><span>Cortical destruction</span></div><div class="sig"><b>Soft Tissue</b><span>Extraosseous mass = concerning</span></div><div class="sig"><b>CT</b><span>Best for scalloping / cortex / mineralization</span></div><div class="sig"><b>MRI</b><span>Defines marrow and soft-tissue extent</span></div></div>`],
      ["Low-Grade Pattern","Low-grade lesions often retain classic cartilage matrix with punctate calcification, rings and arcs, or a popcorn appearance. Deeper endosteal scalloping and expansion favor a more active cartilage neoplasm over enchondroma."],
      ["Higher-Grade Pattern","Grade 2 and 3 tumors more often breach cortex, destroy bone, form extraosseous masses, and show aggressive periosteal change. Mineralization may become less conspicuous as grade increases."],
      ["Imaging Pearl","The distinction between enchondroma and low-grade chondrosarcoma is clinico-radiographic, not purely histologic.","pearl"],
      ["Further Imaging",`<div class="source-actions"><a href="https://radiopaedia.org/articles/chondrosarcoma" target="_blank" rel="noopener noreferrer">Radiopaedia: Chondrosarcoma ↗</a></div>`]
    ],
    "Pathology":[
      ["Grading","Conventional chondrosarcoma is graded based on cellularity, atypia, myxoid change, and other pathologic features. Grade correlates strongly with metastatic potential and prognosis."],
      ["Sampling Challenge","Cartilage tumors are heterogeneous, so core biopsy may underestimate grade—especially in large or pelvic lesions."],
      ["Molecular Note","IDH mutations occur in a substantial proportion of chondrosarcomas and are an area of ongoing therapeutic investigation."]
    ],
    "Staging & Workup":[
      ["Local Assessment","Radiographs, CT, and MRI are used together to characterize cartilage matrix, endosteal scalloping, cortical penetration, marrow extent, and soft-tissue disease."],
      ["Chest Staging","Chest CT is used to evaluate pulmonary metastasis."],
      ["Skeletal Staging","Bone scan may be used when skeletal metastasis or multifocal disease is a concern; PET has an evolving but limited role in primary grading."],
      ["Biopsy Strategy","Biopsy is individualized. In some low-grade-appearing lesions, the clinical and imaging pattern may be more informative than biopsy alone; suspected higher-grade disease generally requires carefully planned tissue diagnosis."]
    ],
    "Treatment":[
      ["Conventional Disease","Surgery is the mainstay because conventional central chondrosarcoma is generally resistant to standard chemotherapy and relatively radioresistant."],
      ["Low-Grade Appendicular Disease","Selected low-grade appendicular cartilage neoplasms can be treated intralesionally with meticulous curettage, with or without adjuvant and reconstruction."],
      ["Axial / Higher-Grade Disease","Wide resection is recommended for axial lesions and for most grade 2, grade 3, and dedifferentiated tumors when resectable."],
      ["Systemic Therapy","Chemotherapy has limited benefit in conventional chondrosarcoma, although it may be considered in selected mesenchymal or dedifferentiated subtypes."],
      ["NP / Clinic Workflow","Track pain progression, local imaging, chest staging, surgical margins, wound and reconstruction status, and recurrence surveillance."]
    ],
    "Prognosis":[
      ["Grade 1","Metastasis is extremely rare without dedifferentiation. Local recurrence can occur, particularly after intralesional treatment."],
      ["Grade 2","Metastatic risk is meaningful; OKU cites reported rates around 5%–15%."],
      ["Grade 3","High-grade disease carries substantially higher local recurrence and distant metastatic risk."],
      ["Key Factors","Histologic grade, anatomic location, resectability, surgical margins, and local recurrence strongly influence outcome."]
    ],
    "Exam":[
      ["How to Assess","Localize tenderness and swelling, palpate for a mass, assess adjacent joint motion and function, and document gait when the pelvis or lower extremity is involved."],
      ["Neurovascular Exam","Perform focused motor, sensory, pulse, and perfusion assessment when tumors approach major neurovascular structures."],
      ["Red Flags","Rapidly worsening pain, enlarging mass, new neurologic deficit, or pathologic fracture should prompt expedited restaging."]
    ],
    "References":[
      ["Primary Source",`<div class="ref"><b>Orthopaedic Knowledge Update: Musculoskeletal Tumors, 4th ed.</b><br>Chapter 17: Chondrosarcoma.</div>`],
      ["Further Imaging",`<div class="ref"><b>Radiopaedia.</b> Chondrosarcoma reference article. External imaging is linked rather than copied.</div>`],
